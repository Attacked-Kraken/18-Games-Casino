<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apex Sound Lab</title>
<!-- Owner Oct 19 2026: "Need Newest, Soundtracks, Sound effects tabs so I can pick and hear ... different music for each app".
     Lists sounds/made/catalog.json (written by the sound robot, tools/sound-robot.mjs). Tap a row to hear it. -->
<style>
:root{--bg:#0f1218;--card:#171b23;--line:#262c38;--txt:#f2f4f8;--dim:#9aa6b5;--acc:#ff2fd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;padding:14px 16px 120px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}header a{color:var(--dim);text-decoration:none;font-size:14px}
h1{font-size:21px;margin:0;flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button,.games button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.games{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.games::-webkit-scrollbar{display:none}
.games button{font-size:13px;padding:6px 11px;font-weight:500;color:var(--dim)}.games button.on{color:#fff;border-color:#fff}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row.play{border-color:var(--acc)}
.pb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#262c38;color:#fff;font-size:18px}
.row.play .pb{background:var(--acc)}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{font-size:12px;color:var(--dim)}
.new{background:#2ad17a;color:#04140a;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.dl{flex:none;color:var(--dim);text-decoration:none;font-size:18px;padding:6px}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0b0d12f2;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
#bar b{display:block;font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .ctl{display:flex;gap:10px;align-items:center}#bar input{flex:1}#bar small{color:var(--dim);font-variant-numeric:tabular-nums;width:86px;text-align:right}
#loop{border:1px solid var(--line);background:none;color:var(--dim);border-radius:8px;padding:5px 8px;font-size:13px}#loop.on{color:#fff;border-color:var(--acc)}
</style></head><body>
<header><a href="../sports.html">&#8592; Back</a><h1>&#127911; Apex Sound Lab</h1></header>
<div class="tabs" id="tabs">
  <button data-t="new" class="on">&#10024; Newest</button><button data-t="music">&#127925; Soundtracks</button>
  <button data-t="effect">&#128165; Sound effects</button><button data-t="engine">&#127949;&#65039; Engines</button>
</div>
<div class="games" id="games"></div>
<div id="list"><div class="empty">Loading…</div></div>
<div id="bar"><b id="now"></b><div class="ctl"><button id="loop" type="button">&#128257; Loop</button><input id="seek" type="range" min="0" max="1000" value="0"><small id="time">0:00</small></div></div>
<audio id="au" preload="none"></audio>
<script>
const GAMES={all:'Menus & UI',hockey:'Ice Hockey',baseball:'Baseball',soccer:'Soccer',flight:'Flight',monstertruck:'Monster Truck',f1:'F1',trackfield:'Track & Field',racer:'Exotic Racer',moto:'Apex Moto'};
const st={tab:'new',game:'*',playing:null,sounds:[]};
try{const s=JSON.parse(localStorage.getItem('soundlab')||'{}'); if(s.tab) st.tab=s.tab; if(s.game) st.game=s.game;}catch(e){}
const au=document.getElementById('au'), $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const save=()=>{try{localStorage.setItem('soundlab',JSON.stringify({tab:st.tab,game:st.game}));}catch(e){}};
function draw(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
  const have=new Set(st.sounds.map(s=>s.game)), g=$('games');
  g.innerHTML='<button data-g="*">Every game</button>'+Object.keys(GAMES).filter(k=>have.has(k)).map(k=>'<button data-g="'+k+'">'+GAMES[k]+'</button>').join('');
  g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===st.game));
  const week=Date.now()-3*864e5;
  let list=st.sounds.filter(s=>st.game==='*'||s.game===st.game||(s.game==='all'&&st.tab==='effect'));
  if(st.tab==='new') list=list.slice().sort((a,b)=>(b.made||'').localeCompare(a.made||'')).slice(0,30);
  else list=list.filter(s=>s.tab===st.tab).sort((a,b)=>(a.game+a.title).localeCompare(b.game+b.title));
  const L=$('list'); if(!list.length){L.innerHTML='<div class="empty">Nothing here yet.</div>';return;}
  L.innerHTML=list.map(s=>{const icon=s.tab==='music'?'&#127925;':s.tab==='engine'?'&#127949;&#65039;':'&#128165;';
    return '<div class="row'+(st.playing===s.name?' play':'')+'" data-n="'+s.name+'"><button class="pb" type="button">'+(st.playing===s.name&&!au.paused?'&#10074;&#10074;':'&#9654;')+'</button>'+
    '<div class="t"><b></b><span>'+icon+' '+(GAMES[s.game]||s.game)+' · '+(s.secs<10?s.secs+' sec':fmt(s.secs))+(s.tab==='music'&&s.secs>=60?' · full song':'')+'</span></div>'+
    '<a class="dl" href="made/'+encodeURIComponent(s.file)+'" download title="Download">&#11015;</a></div>';}).join('');
  L.querySelectorAll('.row').forEach(r=>{const s=st.sounds.find(x=>x.name===r.dataset.n); const b=r.querySelector('b'); b.textContent=s.title;
    if(s.made&&Date.parse(s.made)>week){const n=document.createElement('span'); n.className='new'; n.textContent='NEW'; b.appendChild(n);} });
}
function play(name){const s=st.sounds.find(x=>x.name===name); if(!s) return;
  if(st.playing===name){ if(au.paused) au.play(); else au.pause(); draw(); return; }
  st.playing=name; au.src='made/'+encodeURIComponent(s.file); au.loop=$('loop').classList.contains('on'); au.play().catch(()=>{});
  $('bar').style.display='block'; $('now').textContent=s.title+' — '+(GAMES[s.game]||s.game); draw();}
$('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.tab=b.dataset.t; save(); draw();};
$('games').onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.game=b.dataset.g; save(); draw();};
$('list').onclick=e=>{if(e.target.closest('.dl')) return; const r=e.target.closest('.row'); if(r) play(r.dataset.n);};
$('loop').onclick=()=>{const on=!$('loop').classList.contains('on'); $('loop').classList.toggle('on',on); au.loop=on;};
au.ontimeupdate=()=>{ if(au.duration) $('seek').value=Math.round(au.currentTime/au.duration*1000); $('time').textContent=fmt(au.currentTime)+' / '+fmt(au.duration); };
au.onplay=au.onpause=au.onended=()=>draw();
$('seek').oninput=e=>{ if(au.duration) au.currentTime=e.target.value/1000*au.duration; };
fetch('made/catalog.json?'+Date.now()).then(r=>r.json()).then(j=>{st.sounds=j.sounds||[]; draw();}).catch(()=>{$('list').innerHTML='<div class="empty">The sound robot hasn\'t made the list yet.</div>';});
</script></body></html>
