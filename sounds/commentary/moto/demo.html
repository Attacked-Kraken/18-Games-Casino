<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moto Street Commentary Demo</title><style>body{font-family:system-ui;background:#0b1a2a;color:#fff;margin:16px}button{margin:4px;padding:10px 12px;border:0;border-radius:8px;background:#1f6feb;color:#fff;font-size:15px}#t{min-height:3em;margin:10px 0;color:#9fe}</style></head>
<body><h2>Moto Street Commentary Demo</h2><p>Run a local server in this folder (e.g. <code>python3 -m http.server</code>), then open demo.html.</p>
<button onclick="new Audio('sample.mp3').play()">▶ Sample broadcast</button><button onclick="c.dialogue(null,{priority:true})" style="background:#8957e5">💬 Random dialogue</button>
<div id="t"></div><div id="b"></div><script src="commentary.js"></script><script>
const c=new Commentary({cooldown:300});const orig=c._play.bind(c);c._play=cl=>{document.getElementById('t').textContent=cl.map(x=>(x.speaker=='announcer'?'🎙️ ':'🎧 ')+x.text).join('  ');return orig(cl)};
c.load().then(()=>{for(const e of c.events()){const b=document.createElement('button');b.textContent=e.replace(/_/g,' ');b.onclick=()=>c.say(e,{priority:true});document.getElementById('b').appendChild(b)}});
</script></body></html>
