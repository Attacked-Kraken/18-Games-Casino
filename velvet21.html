  <div><i>🪙</i><span>Tap chips to bet, then <b>Deal</b>. <b>Reset</b> clears your bet, <b>All In</b> bets everything (up to the table max).</span></div>
  <div><i>🂠</i><span><b>Hit</b> takes a card. <b>Stand</b> keeps your hand. <b>Double</b> doubles your bet for exactly one more card. <b>Split</b> turns a pair into two hands.</span></div>
  <div><i>⭐</i><span><b>Blackjack</b> (Ace + a 10 card) pays 3 to 2. A normal win pays 1 to 1, a tie is a push and you get your bet back.</span></div>
  <div><i>🛡️</i><span>When the dealer shows an Ace you can buy <b>insurance</b> for half your bet. It pays 2 to 1 if the dealer has Blackjack.</span></div>
  <div><i>🎩</i><span>The dealer draws to 16 and stands on all 17s. Six decks, shuffled with a true random shuffle.</span></div>
  <div><i>💡</i><span>Not sure? Tap <b>Tip</b> during a hand to see the best play.</span></div>
  <div><i>🔥</i><span>Win 3+ rounds in a row for streak bonus chips. Level up to unlock lounges and card backs.</span></div>
  <div><i>🎈</i><span>Play chips only. No real money: chips can't be bought or cashed out.</span></div></div>
  <button class="btn big" type="button" onclick="document.querySelector('#modal .x').click()">Got it</button>`); }
function statsModal() { const s = S.stats, wr = s.hands ? Math.round(s.wins / s.hands * 100) : 0;
  const cell = (b, t) => `<div class="stat"><b>${b}</b><small>${t}</small></div>`;
  modal(`<h3>📊 Your Stats</h3><div class="stats">${cell(commas(s.hands), 'Hands played')}${cell(wr + '%', 'Win rate')}${cell(commas(s.wins), 'Hands won')}${cell(commas(s.losses), 'Hands lost')}${cell(commas(s.pushes), 'Pushes')}${cell(commas(s.bj), 'Blackjacks')}
    ${cell(commas(s.dblW), 'Double downs won')}${cell(commas(s.splitW), 'Split hands won')}${cell(s.best, 'Best win streak')}${cell(short(s.big), 'Biggest win')}${cell(short(s.won), 'Chips won')}${cell(S.lvl, 'Level')}</div>`); }
function backsModal() { modal(`<h3>🂠 Card Backs</h3><div class="backs">${BACKS.map((b, i) => `<button type="button" data-i="${i}" class="${S.back === i ? 'on' : ''}" ${b.lv > S.lvl ? 'disabled' : ''}><div class="cd back"><div class="bk bk${i}"></div></div>${b.n}<small style="font:800 10px system-ui;color:#a090a8">${b.lv > S.lvl ? '🔒 Level ' + b.lv : S.back === i ? 'Using' : 'Tap to use'}</small></button>`).join('')}</div>`,
  () => $('mBody').querySelectorAll('.backs button').forEach((b) => b.onclick = () => { S.back = +b.dataset.i; save(); SFX.tap(); backsModal(); })); }
function avModal() { modal(`<h3>Pick your avatar</h3><div class="avs">${AVS.map((a, i) => `<button type="button" data-i="${i}"><span class="av ${S.av === i ? 'on' : ''}">${a}</span></button>`).join('')}</div>`,
  () => $('mBody').querySelectorAll('.avs button').forEach((b) => b.onclick = () => { S.av = +b.dataset.i; save(); SFX.tap(); closeModal(); home(); })); }
function setModal() { const row = (k, t) => `<div class="set">${t}<button class="tog ${S[k] ? 'on' : ''}" data-k="${k}" type="button" aria-label="${t}"></button></div>`;
  modal(`<h3>⚙️ Settings</h3>${row('talk', '🗣️ Talking dealer')}${row('sfx', '🔊 Card and chip sounds')}${row('fast', '⚡ Fast dealing')}<p class="p">Music has its own button in the corner.</p>`,
  () => $('mBody').querySelectorAll('.tog').forEach((b) => b.onclick = () => { const k = b.dataset.k; S[k] = S[k] ? 0 : 1; save(); b.classList.toggle('on', !!S[k]); if (k === 'talk' && S[k]) say('Hi, I will call the game for you.'); })); }

$('hPlay').onclick = () => { ac(); SFX.tap(); lounges(); };
$('tDaily').onclick = () => { ac(); SFX.tap(); dailyModal(); };
$('tFree').onclick = () => { ac(); claimFree(); };
$('tCh').onclick = () => { ac(); SFX.tap(); chModal(); };
$('tFr').onclick = () => { ac(); SFX.tap(); friends(); };
$('tStats').onclick = () => { ac(); SFX.tap(); statsModal(); };
$('tBacks').onclick = () => { ac(); SFX.tap(); backsModal(); };
$('tHow').onclick = () => { ac(); SFX.tap(); howTo(); };
$('tSet').onclick = () => { ac(); SFX.tap(); setModal(); };
$('hAv').onclick = () => { ac(); SFX.tap(); avModal(); };

/* ================================================================ shell + start */
function inRound() { if (!G) return false; const m = betting(); return m === 'play'; }
try { ArcadeShell.init({ game: 'velvet21', backEl: '#back', onBack: () => {
  if (!$('modal').classList.contains('hide')) { closeModal(); refresh(); return true; }
  if (G && !$('table').classList.contains('hide')) { if (inRound() && !G.mp) { toast('Finish this hand first'); return true; } leaveTable(); return true; }
  if (!$('lounges').classList.contains('hide')) { home(); return true; }
  return false; } }); } catch (e) {}
document.addEventListener('pointerdown', () => ac(), { once: true });
load();
// a round that was cut off (app closed mid-hand) is over: its bet stays with the house, like walking away from a real table
if (S.led && !S.led.paid) { S.led.paid = 1; save(); }
home();
if (dailyState().ready) setTimeout(() => dailyModal(true), 600);
window.__v21 = { E, get G() { return G; }, S: () => S, setS: (o) => { Object.assign(S, o); save(); refresh(); }, render, enterTable };
})();
</script>
