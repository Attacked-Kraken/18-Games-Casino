<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Truck Studio — Apex Arcade</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0d11;
    font-family:system-ui, -apple-system, sans-serif; touch-action:none;
    -webkit-user-select:none; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; top:0; left:0; right:0; padding:14px 18px; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start; z-index:10; }
  #title { color:#f2f5f9; font-weight:800; letter-spacing:.18em; font-size:13px; }
  #title small { display:block; font-weight:600; color:#8b95a5; letter-spacing:.08em; font-size:10px; margin-top:3px; }
  #hint { color:#8b95a5; font-size:11px; letter-spacing:.06em; text-align:right; }
  #swatches { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; gap:10px; justify-content:center; z-index:10; }
  .sw { width:38px; height:38px; border-radius:50%; border:2px solid rgba(255,255,255,.25);
    cursor:pointer; pointer-events:auto; }
  .sw.on { border-color:#ffb200; box-shadow:0 0 12px rgba(255,178,0,.6); }
  #back { position:fixed; top:14px; left:18px; z-index:11; color:#cfd8e3; text-decoration:none;
    font-size:12px; font-weight:700; letter-spacing:.12em; background:rgba(255,255,255,.08);
    padding:8px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.14); }
</style>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title">TRUCK STUDIO<small>APEX ARCADE &middot; drag to orbit &middot; pinch to zoom</small></div>
  <div id="hint">MODEL V1<br>work-in-progress</div>
</div>
<div id="swatches"></div>
<script type="module">
import * as THREE from 'three';

/* ================= renderer / scene ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d11);
scene.fog = new THREE.Fog(0x0b0d11, 40, 90);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

/* studio environment for paint reflections */
{
  const pm = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x11141a);
  const geo = new THREE.SphereGeometry(50, 16, 12);
  const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true });
  const cols = [], pos = geo.attributes.position;
  const top = new THREE.Color(0x3a4356), mid = new THREE.Color(0x14171d), bot = new THREE.Color(0x05060a);
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 50;
    const c = y > 0 ? mid.clone().lerp(top, y) : mid.clone().lerp(bot, -y);
    if (Math.abs(y) < 0.15) c.lerp(new THREE.Color(0xfff1dd), 0.55); // softbox band
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(geo, mat));
  scene.environment = pm.fromScene(envScene, 0.05).texture;
  pm.dispose();
}

/* 3-point studio lighting */
const key = new THREE.DirectionalLight(0xfff1dd, 3.0);
key.position.set(10, 14, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 10; key.shadow.camera.bottom = -10;
key.shadow.camera.far = 50; key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbdd0ff, 0.9); fill.position.set(-12, 6, 6); scene.add(fill);
const rim = new THREE.DirectionalLight(0x88aaff, 1.6); rim.position.set(-6, 10, -12); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

/* studio floor */
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const grad = g.createRadialGradient(256, 256, 40, 256, 256, 256);
  grad.addColorStop(0, '#2a2f3a'); grad.addColorStop(0.55, '#171b23'); grad.addColorStop(1, '#0b0d11');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(cv);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 48),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.1 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
}

/* ================= procedural textures ================= */
function makeTex(w, h, fn) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  fn(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// paint: subtle metallic flake + faint grime low
const paintTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#c22418'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
  }
  const gr = g.createLinearGradient(0, h * 0.6, 0, h);
  gr.addColorStop(0, 'rgba(20,12,8,0)'); gr.addColorStop(1, 'rgba(20,12,8,0.35)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
paintTex.wrapS = paintTex.wrapT = THREE.RepeatWrapping;
// tire sidewall lettering (original APEX design)
const sidewallTex = makeTex(512, 128, (g, w, h) => {
  g.fillStyle = '#17130f'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#8f8f8f'; g.font = '900 54px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('A P E X', w / 2, h / 2);
});
function mergeGeos(geos) {
  let vCount = 0, iCount = 0;
  for (const g of geos) { vCount += g.attributes.position.count; iCount += g.index.count; }
  const pos = new Float32Array(vCount * 3), nor = new Float32Array(vCount * 3), uv = new Float32Array(vCount * 2);
  const idx = new Uint16Array(iCount);
  let vo = 0, io = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, vo * 3);
    nor.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    const gi = g.index.array;
    for (let i = 0; i < gi.length; i++) idx[io + i] = gi[i] + vo;
    vo += g.attributes.position.count; io += gi.length;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

/* ================= THE TRUCK (v1) =================
   Ref DNA: real pickup silhouette with wheel-arch cutouts in the bodywork,
   fat chevron tires, tall visible tube chassis + coilovers, chrome grille. */
const truck = new THREE.Group();
const wheels = [];
const paintMat = new THREE.MeshStandardMaterial({ map: paintTex, roughness: 0.32, metalness: 0.25 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x16181d, roughness: 0.75, metalness: 0.3 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x0d1420, roughness: 0.08, metalness: 0.85 });
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xd7dde6, roughness: 0.18, metalness: 1.0 });
const tubeMat = new THREE.MeshStandardMaterial({ color: 0x1e2126, roughness: 0.5, metalness: 0.75 });
const coilMat = new THREE.MeshStandardMaterial({ color: 0xb02020, roughness: 0.45, metalness: 0.4 });

function addMesh(geo, mat, x, y, z, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = cast;
  truck.add(m); return m;
}

/* ---- tube chassis: rails + cross members (highly visible, like the refs) ---- */
for (const sx of [-0.85, 0.85]) {
  addMesh(new THREE.BoxGeometry(0.24, 0.4, 7.0), tubeMat, sx, 2.6, 0);
}
for (const sz of [-2.8, -1.0, 1.0, 2.8]) {
  addMesh(new THREE.BoxGeometry(1.9, 0.22, 0.22), tubeMat, 0, 2.6, sz);
}
/* 4-link bars */
for (const [sx, sz] of [[-1.15, 2.4], [1.15, 2.4], [-1.15, -2.4], [1.15, -2.4]]) {
  const bar = addMesh(new THREE.CylinderGeometry(0.09, 0.09, 2.6, 8), chromeMat, sx * 0.8, 2.1, sz * 0.8);
  bar.rotation.x = Math.PI / 2; bar.rotation.y = sx > 0 ? 0.25 : -0.25;
}
/* axles + differentials */
for (const sz of [-2.4, 2.4]) {
  addMesh(new THREE.BoxGeometry(3.6, 0.3, 0.36), tubeMat, 0, 1.8, sz);
  const diff = addMesh(new THREE.SphereGeometry(0.36, 12, 10), tubeMat, 0, 1.8, sz);
  diff.scale.set(1, 0.85, 1);
}
const dshaft = addMesh(new THREE.CylinderGeometry(0.12, 0.12, 5.0, 10), tubeMat, 0, 2.2, 0);
dshaft.rotation.x = Math.PI / 2;
/* big coilovers with springs (hero detail from the refs) */
function coilover(x, y, z) {
  const grp = new THREE.Group(); grp.position.set(x, y, z);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1.7, 10), chromeMat);
  grp.add(body);
  // spring: helix tube
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const a = (i / 120) * Math.PI * 2 * 7, yy = -0.8 + (i / 120) * 1.6;
    pts.push(new THREE.Vector3(Math.cos(a) * 0.22, yy, Math.sin(a) * 0.22));
  }
  const spring = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 200, 0.05, 6), coilMat);
  spring.castShadow = true; grp.add(spring);
  truck.add(grp);
}
for (const [sx, sz] of [[-1.3, 2.4], [1.3, 2.4], [-1.3, -2.4], [1.3, -2.4]]) coilover(sx, 3.0, sz);

/* ---- body: extruded side profile WITH wheel-arch cutouts ---- */
{
  const s = new THREE.Shape();
  const archR = 2.05, axleY = 1.8, edgeY = 3.0;
  const dy = edgeY - axleY, dx = Math.sqrt(archR * archR - dy * dy);
  const a0 = Math.PI - Math.asin(dy / archR), a1 = Math.asin(dy / archR);
  const WB = 2.4, rearX = -3.9, frontX = 3.9;
  s.moveTo(rearX, edgeY);
  s.absarc(-WB, axleY, archR, a0, a1, true);          // rear arch
  s.lineTo(WB - dx, edgeY);                            // between wheels
  s.absarc(WB, axleY, archR, a0, a1, true);            // front arch
  s.lineTo(frontX, edgeY);
  s.lineTo(frontX, 3.55);                              // grille face
  s.lineTo(3.7, 3.7); s.lineTo(1.3, 3.82);             // long hood (lower)
  s.lineTo(1.1, 4.05);                                 // cowl step up
  s.lineTo(-1.25, 4.05);                               // beltline
  s.lineTo(-3.75, 4.15); s.lineTo(rearX, 4.15);        // bed rail
  s.lineTo(rearX, edgeY);                              // tailgate
  const geo = new THREE.ExtrudeGeometry(s, { depth: 2.6, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 2 });
  geo.translate(0, 0, -1.3);
  const body = new THREE.Mesh(geo, paintMat);
  body.rotation.y = -Math.PI / 2; // profile +x (front) -> world +z (front)
  body.castShadow = true; truck.add(body);
}
/* hood scoop */
addMesh(new THREE.BoxGeometry(0.95, 0.32, 1.15), darkMat, 0, 3.98, 2.2);
/* chrome grille + bumper + headlights */
{
  const gt = makeTex(256, 96, (g, w, h) => {
    g.fillStyle = '#101318'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#cdd6e2';
    for (let i = 0; i < 9; i++) g.fillRect(10 + i * 27, 8, 11, h - 16);
  });
  addMesh(new THREE.BoxGeometry(1.85, 0.85, 0.14),
    new THREE.MeshStandardMaterial({ map: gt, roughness: 0.35, metalness: 0.7 }), 0, 3.3, 3.92);
  addMesh(new THREE.BoxGeometry(3.1, 0.34, 0.5), chromeMat, 0, 2.9, 3.82); // bumper
  for (const sx of [-0.85, 0.85]) // headlights
    addMesh(new THREE.BoxGeometry(0.5, 0.3, 0.1), new THREE.MeshBasicMaterial({ color: 0xfff3c0 }), sx, 3.65, 3.88);
}
/* greenhouse: raked windshield, roof, side + rear glass */
{
  const shield = addMesh(new THREE.BoxGeometry(2.3, 1.05, 0.1), glassMat, 0, 4.55, 0.68);
  shield.rotation.x = -0.5; // raked
  addMesh(new THREE.BoxGeometry(2.5, 0.14, 1.8), paintMat, 0, 5.07, -0.4); // roof
  for (const sx of [-1.28, 1.28])
    addMesh(new THREE.BoxGeometry(0.08, 0.8, 1.45), glassMat, sx, 4.55, -0.4);
  const rg = addMesh(new THREE.BoxGeometry(2.3, 0.8, 0.1), glassMat, 0, 4.55, -1.28);
  rg.rotation.x = 0.18;
  /* A-pillars */
  for (const sx of [-1.28, 1.28]) {
    const a = addMesh(new THREE.BoxGeometry(0.12, 1.1, 0.12), paintMat, sx, 4.53, 0.6);
    a.rotation.x = -0.5;
  }
}
/* roof light bar: 5 round lamps */
addMesh(new THREE.BoxGeometry(2.2, 0.14, 0.35), darkMat, 0, 5.23, -0.4);
{
  const lg = new THREE.CylinderGeometry(0.16, 0.16, 0.14, 14);
  lg.rotateX(Math.PI / 2);
  const lm = new THREE.MeshBasicMaterial({ color: 0xfff3c0 });
  for (let i = -2; i <= 2; i++) addMesh(lg, lm, i * 0.44, 5.23, -0.23, false);
}
/* mirrors + door handles */
for (const sx of [-1.55, 1.55]) {
  addMesh(new THREE.BoxGeometry(0.2, 0.28, 0.1), darkMat, sx, 4.4, 0.8);
  addMesh(new THREE.BoxGeometry(0.07, 0.07, 0.35), darkMat, sx * 0.92, 4.35, 0.68);
  addMesh(new THREE.BoxGeometry(0.1, 0.07, 0.3), chromeMat, sx > 0 ? 1.52 : -1.52, 3.9, -0.25);
}
/* side exhaust stacks */
for (const sx of [-1.35, 1.35]) {
  const ex = addMesh(new THREE.CylinderGeometry(0.12, 0.12, 2.6, 10), chromeMat, sx, 3.0, -0.4);
  ex.rotation.x = Math.PI / 2;
  const tip = addMesh(new THREE.CylinderGeometry(0.16, 0.16, 0.25, 10), darkMat, sx, 3.0, -1.75);
  tip.rotation.x = Math.PI / 2;
}
/* taillights */
for (const sx of [-0.9, 0.9])
  addMesh(new THREE.BoxGeometry(0.44, 0.26, 0.1), new THREE.MeshBasicMaterial({ color: 0xff2a1e }), sx, 3.5, -3.92);

/* ---- FAT chevron tires, lettered sidewalls, deep-dish rims ---- */
{
  const lugGeos = [];
  for (let i = 0; i < 18; i++) {
    const lug = new THREE.BoxGeometry(1.44, 0.38, 0.88);
    lug.rotateX(i % 2 ? 0.38 : -0.38);
    lug.translate(0, 1.82, 0);
    lug.rotateX((i / 18) * Math.PI * 2);
    lugGeos.push(lug);
  }
  const treadGeo = mergeGeos(lugGeos);
  const tireGeo = new THREE.CylinderGeometry(1.8, 1.8, 1.4, 28);
  const hubGeo = new THREE.CylinderGeometry(0.8, 0.8, 1.44, 18);
  const capGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.48, 10);
  const lipGeo = new THREE.TorusGeometry(0.78, 0.12, 10, 26); lipGeo.rotateY(Math.PI / 2);
  const ringGeos = [];
  for (const fx of [-0.75, 0.75]) for (let i = 0; i < 8; i++) {
    const lg = new THREE.CylinderGeometry(0.09, 0.09, 0.2, 6); lg.rotateZ(Math.PI / 2);
    const a = (i / 8) * Math.PI * 2;
    lg.translate(fx, Math.sin(a) * 0.44, Math.cos(a) * 0.44);
    ringGeos.push(lg);
  }
  const ringGeo = mergeGeos(ringGeos);
  const tireSideM = new THREE.MeshStandardMaterial({ color: 0x191512, roughness: 0.95 });
  const tireCapM = new THREE.MeshStandardMaterial({ map: sidewallTex, roughness: 0.95 });
  const hubMat = new THREE.MeshStandardMaterial({ color: 0xd8b13a, roughness: 0.3, metalness: 0.85 });
  const lugMat = new THREE.MeshStandardMaterial({ color: 0x9aa0aa, roughness: 0.3, metalness: 0.9 });
  const treadMat = new THREE.MeshStandardMaterial({ color: 0x141210, roughness: 0.95 });
  for (const [wx, wz] of [[-1.45, 2.4], [1.45, 2.4], [-1.45, -2.4], [1.45, -2.4]]) {
    const pivot = new THREE.Group(); pivot.position.set(wx, 1.8, wz);
    const tire = new THREE.Mesh(tireGeo, [tireSideM, tireCapM, tireCapM]);
    tire.rotation.z = Math.PI / 2; tire.castShadow = true;
    const tread = new THREE.Mesh(treadGeo, treadMat); tread.castShadow = true;
    const hub = new THREE.Mesh(hubGeo, hubMat); hub.rotation.z = Math.PI / 2;
    const cap = new THREE.Mesh(capGeo, darkMat); cap.rotation.z = Math.PI / 2;
    const lipO = new THREE.Mesh(lipGeo, chromeMat); lipO.position.x = 0.73;
    const lipI = new THREE.Mesh(lipGeo, chromeMat); lipI.position.x = -0.73;
    const lugs = new THREE.Mesh(ringGeo, lugMat);
    pivot.add(tire, tread, hub, cap, lipO, lipI, lugs);
    truck.add(pivot); wheels.push(pivot);
  }
}
scene.add(truck);

/* ================= studio controls: orbit + zoom + turntable ================= */
let theta = 0.7, phi = 1.12, radius = 15, auto = true;
const target = new THREE.Vector3(0, 3.0, 0);
function applyCam() {
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(target);
}
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize); resize(); applyCam();

let pdown = null, pmoved = 0;
canvas.addEventListener('pointerdown', e => { pdown = { x: e.clientX, y: e.clientY }; pmoved = 0; auto = false; });
window.addEventListener('pointermove', e => {
  if (!pdown) return;
  const dx = e.clientX - pdown.x, dy = e.clientY - pdown.y;
  pmoved += Math.abs(dx) + Math.abs(dy);
  theta -= dx * 0.008; phi = Math.max(0.25, Math.min(1.45, phi - dy * 0.006));
  pdown = { x: e.clientX, y: e.clientY };
  applyCam();
});
window.addEventListener('pointerup', () => { pdown = null; setTimeout(() => { if (pmoved < 8) auto = true; }, 2500); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(8, Math.min(30, radius * (1 + e.deltaY * 0.001)));
  applyCam();
}, { passive: false });
/* pinch zoom */
let pinchD = 0;
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinchD > 0) { radius = Math.max(8, Math.min(30, radius * (pinchD / d))); applyCam(); }
    pinchD = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchD = 0; });

/* paint swatches */
const paints = [
  ['#c22418', 'APEX RED'], ['#e8641b', 'BLAZE'], ['#1c6dd9', 'COBALT'],
  ['#18a058', 'PADDOCK'], ['#f2f2f2', 'ARCTIC'], ['#15171c', 'STEALTH'],
];
const swWrap = document.getElementById('swatches');
paints.forEach(([hex, name], i) => {
  const b = document.createElement('div');
  b.className = 'sw' + (i === 0 ? ' on' : ''); b.style.background = hex; b.title = name;
  b.addEventListener('pointerdown', e => {
    e.stopPropagation();
    document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    paintMat.color.set(hex); paintMat.map = null; paintMat.needsUpdate = true;
  });
  swWrap.appendChild(b);
});

/* ================= loop ================= */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (auto) { theta += dt * 0.35; applyCam(); }
  for (const w of wheels) w.rotation.x += dt * 0.4;
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
