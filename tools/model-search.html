<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Model Search</title>
<!-- Owner Oct 19 2026: "yes search mode for the sketchfab bot". Shows what tools/sketchfab-search.mjs found (models/search/),
     spin each one in 3D, tap "Get it" -> models/picks/<id>.txt -> the fetch robot downloads + slims it. -->
<style>
:root{--bg:#0f1218;--card:#171b23;--line:#262c38;--txt:#f2f4f8;--dim:#9aa6b5;--acc:#2f9bff;--ok:#2ad17a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}header a{color:var(--dim);text-decoration:none;font-size:14px}
h1{font-size:21px;margin:0;flex:1}.sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
.chips button.on{background:var(--acc);border-color:var(--acc)}
.for{color:var(--dim);font-size:13px;margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.c.got{border-color:var(--ok)}
.c img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#0b0d12;display:block}
.c .b{padding:9px 10px;flex:1;display:flex;flex-direction:column;gap:3px}
.c b{font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c span{font-size:12px;color:var(--dim)}
.c .btns{display:flex;gap:6px;padding:0 10px 10px}
.c .btns button,.c .btns a{flex:1;border:0;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:700;text-align:center;text-decoration:none;color:#fff;background:#262c38}
.c .btns .get{background:var(--ok);color:#04140a}
.empty{color:var(--dim);text-align:center;padding:40px 10px}
#m{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;z-index:9;padding:calc(10px + env(safe-area-inset-top)) 10px 10px}
#m.show{display:flex}#m iframe{flex:1;border:0;border-radius:12px;background:#111;width:100%}
#m .top{display:flex;gap:8px;align-items:center;margin-bottom:8px}#m .top b{flex:1;font-size:15px}
#m button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
</style></head><body>
<header><a href="../sports.html">&#8592; Back</a><h1>&#128269; Model Search</h1></header>
<p class="sub">Free Sketchfab models only (CC Attribution / CC0, under 20 MB). Spin one in 3D, then <b>Get it</b> - on GitHub tap <b>Commit changes</b> and the robot downloads and slims it.</p>
<div class="chips" id="chips"></div>
<div class="for" id="for"></div>
<div class="grid" id="grid"><div class="empty">Loading…</div></div>
<div id="m"><div class="top"><b id="mt"></b><button id="mget" style="background:#2ad17a">Get it</button><button id="mx" style="background:#262c38;color:#fff">Close</button></div><iframe id="mf" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe></div>
<script>
const $=id=>document.getElementById(id), REPO='https://github.com/Attacked-Kraken/18-Games-Casino';
let idx=[], cur=null, data=null, got={};
try{ got=JSON.parse(localStorage.getItem('modelpicks')||'{}'); }catch(e){}
// ASSET-LAW: no real brands - warn on real car/bike makers (the model can still be used with badges/logos painted out)
const BRAND=/porsche|ferrari|lamborghini|mercedes|bmw|audi|honda|toyota|nissan|ford|chevrolet|chevy|dodge|mclaren|bugatti|koenigsegg|pagani|aston martin|bentley|jaguar|lexus|mazda|subaru|tesla|volkswagen|\bvw\b|ducati|yamaha|kawasaki|suzuki|harley|ktm|red bull|mercedes|boeing|airbus|cessna|nike|adidas|nhl|mlb|nfl|fifa|kia|hyundai/i;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getLink(r){ const what=(data&&data.for)||(data&&data.words)||'';
  return REPO+'/new/main?filename='+encodeURIComponent('models/picks/'+r.uid+'.txt')+'&value='+encodeURIComponent('for '+what+' · '+r.name+' by '+r.maker+' · '+r.link); }
function mark(uid){ got[uid]=1; try{ localStorage.setItem('modelpicks',JSON.stringify(got)); }catch(e){} draw(); }
function chips(){ $('chips').innerHTML=idx.map(s=>'<button data-s="'+esc(s.slug)+'" class="'+(cur===s.slug?'on':'')+'">'+esc(s.words)+' <small>('+s.count+')</small></button>').join(''); }
async function openSearch(slug){ cur=slug; chips(); try{ localStorage.setItem('modelsearch',slug); }catch(e){}
  $('grid').innerHTML='<div class="empty">Loading…</div>';
  try{ data=await (await fetch('../models/search/'+slug+'.json?'+Date.now())).json(); }catch(e){ data=null; }
  draw(); }
function draw(){ if(!data){ $('grid').innerHTML='<div class="empty">Couldn\'t load this search.</div>'; return; }
  $('for').textContent=(data.for?'For: '+data.for+' · ':'')+'searched '+data.date;
  if(!data.results.length){ $('grid').innerHTML='<div class="empty">Nothing free and small enough for this search - try other words.</div>'; return; }
  $('grid').innerHTML=data.results.map((r,i)=>'<div class="c'+(got[r.uid]?' got':'')+'"><img loading="lazy" src="'+esc(r.thumb)+'" alt="">'+
    '<div class="b"><b>'+esc(r.name)+'</b><span>by '+esc(r.maker)+'</span>'+(BRAND.test(r.name)?'<span style="color:#ffb020">&#9888;&#65039; real brand - logos must be painted out</span>':'')+'<span>'+esc(r.license)+(r.mb!=null?' · '+r.mb+' MB':'')+(r.faces?' · '+Math.round(r.faces/1000)+'k faces':'')+'</span></div>'+
    '<div class="btns"><button data-spin="'+i+'">&#128260; 3D</button><a class="get" data-get="'+i+'" href="'+esc(getLink(r))+'" target="_blank" rel="noopener">'+(got[r.uid]?'&#10003; Asked':'Get it')+'</a></div></div>').join(''); }
$('chips').onclick=e=>{ const b=e.target.closest('button'); if(b) openSearch(b.dataset.s); };
$('grid').onclick=e=>{ const s=e.target.closest('[data-spin]'), g=e.target.closest('[data-get]');
  if(g){ mark(data.results[+g.dataset.get].uid); return; }
  if(s){ const r=data.results[+s.dataset.spin]; $('mt').textContent=r.name; $('mf').src='https://sketchfab.com/models/'+r.uid+'/embed?autostart=1&ui_infos=0&ui_watermark=0&ui_help=0&ui_settings=0&ui_vr=0';
    $('mget').onclick=()=>{ window.open(getLink(r),'_blank'); mark(r.uid); }; $('m').classList.add('show'); } };
$('mx').onclick=()=>{ $('m').classList.remove('show'); $('mf').src='about:blank'; };
fetch('../models/search/index.json?'+Date.now()).then(r=>r.json()).then(j=>{ idx=j||[]; if(!idx.length){ $('grid').innerHTML='<div class="empty">No searches yet.</div>'; return; }
  let s=null; try{ s=localStorage.getItem('modelsearch'); }catch(e){} openSearch(idx.some(x=>x.slug===s)?s:idx[0].slug); })
  .catch(()=>{ $('grid').innerHTML='<div class="empty">The search robot hasn\'t run yet.</div>'; });
</script></body></html>
