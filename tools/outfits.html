<!doctype html><body style="margin:0;background:#2a1a1e"><script type="module">
import * as THREE from '../three.module.min.js'; import { loadHumans } from '../characters/base-human-v2/humans.js';
const q = new URLSearchParams(location.search), G = q.get('g') || 'm';
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x3a2a30); S.add(new THREE.HemisphereLight(0xfff0e0, 0x302020, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); S.add(d);
const H = await loadHumans(THREE, '../characters/base-human-v2/'); const ids = Object.keys(H.OUTFITS[G]); const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 100);
const zoom = q.get('face'); const n = ids.length, sp = .9; const hs = [];
ids.forEach((id, i) => { const h = H.make({ g: G, outfit: id, skin: i % 6, hair: H.HAIR[G][i % H.HAIR[G].length], hairCol: H.HAIR_COLS[(i * 2) % 9], ci: i }); h.object.position.x = (i - (n - 1) / 2) * sp; S.add(h.object); h.play(q.get('clip') || 'Idle_Loop', 0); h.mixer.setTime(.6 + i * .1); hs.push(h); });
if (zoom) { cam.position.set(((+zoom) - (n - 1) / 2) * sp, 1.62, 1.0); cam.lookAt(((+zoom) - (n - 1) / 2) * sp, 1.6, 0); } else { cam.position.set(0, 1.0, 9.5); cam.lookAt(0, .9, 0); }
let t0 = performance.now(); function f() { const t = performance.now(); hs.forEach((h) => h.mixer.update((t - t0) / 1000)); t0 = t; R.render(S, cam); requestAnimationFrame(f); } f(); setTimeout(() => (document.title = 'ready'), 1500);
</script></body>
