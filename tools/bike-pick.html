<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick a Sport Bike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#141414;color:#fff}
h1{text-align:center;padding:14px 10px 2px;font-size:18px}
p.sub{text-align:center;font-size:12px;opacity:.6;padding-bottom:8px}
#view{width:100%;height:60vh;background:#222;touch-action:none;display:block}
#bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}
#bar button{padding:12px 18px;border:none;border-radius:10px;background:#2a2a2a;color:#fff;font-size:15px}
#bar button.on{background:#e67e22}
#info{text-align:center;font-size:13px;opacity:.75;padding:0 16px 18px}
</style>
<script type="importmap">{"imports":{"three":"../three.module.min.js"}}</script>
</head><body>
<h1 id="title">Sport Bike</h1><p class="sub">drag to spin · pinch to zoom · needs internet (models load from Poly Pizza)</p>
<canvas id="view"></canvas><div id="bar"></div><div id="info">Loading…</div>
<script type="module">
// Owner Oct 18 9:48 PM: a Muse's bike viewer showed nothing in his phone's file viewer (it pulled its 3D player from
// Google). Same 5 Poly Pizza bikes, drawn with our own three.js so it works on the Game Development site.
import * as THREE from '../three.module.min.js';
import { GLTFLoader } from '../vendor/GLTFLoader.js';
const bikes = [
  { n: 'Bike 1', s: '108 KB', u: 'https://static.poly.pizza/f7635710-7cfa-4768-ad70-8366ab485358.glb' },
  { n: 'Bike 2', s: '172 KB', u: 'https://static.poly.pizza/34db1344-31cc-49ac-bc46-c055f68e39ca.glb' },
  { n: 'Bike 3', s: '1.2 MB', u: 'https://static.poly.pizza/4fa4f21a-c3b8-425f-8e57-9c202b1d6ba6.glb' },
  { n: 'Bike 4', s: '2.2 MB', u: 'https://static.poly.pizza/191eebc7-b1f8-4ec7-8652-9c6c49521b99.glb' },
  { n: 'Bike 5', s: '2.3 MB', u: 'https://static.poly.pizza/6048701b-fa87-426b-9242-c786ca25fa3a.glb' },
];
const cv = document.getElementById('view'), info = document.getElementById('info'), bar = document.getElementById('bar'), title = document.getElementById('title');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x222222);
const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 5, 4); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.ShadowMaterial({ opacity: 0.35 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
let model = null, yaw = 0.6, pitch = 0.25, dist = 3, auto = true, size = 1;
const loader = new GLTFLoader();
function resize() { const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function pick(i) {
  [...bar.children].forEach((b, j) => b.classList.toggle('on', j === i)); title.textContent = bikes[i].n + ' — Sport Bike';
  info.textContent = 'Loading ' + bikes[i].n + ' (' + bikes[i].s + ')…';
  loader.load(bikes[i].u, (g) => {
    if (model) scene.remove(model); model = g.scene;
    const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    size = Math.max(sz.x, sz.y, sz.z); const k = 1.6 / size; model.scale.setScalar(k);
    model.position.set(-c.x * k, -box.min.y * k, -c.z * k); model.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(model); dist = 3.2; info.textContent = bikes[i].n + ' · ' + bikes[i].s + ' · from Poly Pizza (check its license before it goes in a game)';
  }, undefined, () => { info.textContent = "Couldn't load " + bikes[i].n + ' - check the internet and try again.'; });
}
bikes.forEach((b, i) => { const btn = document.createElement('button'); btn.textContent = b.n; btn.onclick = () => pick(i); bar.appendChild(btn); });
// touch: one finger spins, two fingers pinch zoom
const pts = new Map(); let lastD = 0;
cv.addEventListener('pointerdown', e => { pts.set(e.pointerId, e); cv.setPointerCapture(e.pointerId); auto = false; });
cv.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return;
  if (pts.size === 1) { yaw -= (e.clientX - p.clientX) * 0.01; pitch = Math.max(-0.2, Math.min(1.3, pitch + (e.clientY - p.clientY) * 0.008)); }
  pts.set(e.pointerId, e);
  if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (lastD) dist = Math.max(1.2, Math.min(8, dist * lastD / d)); lastD = d; } });
const up = e => { pts.delete(e.pointerId); lastD = 0; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { dist = Math.max(1.2, Math.min(8, dist * (1 + e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });
window.__setView = (y) => { auto = false; yaw = y; pitch = 0.2; };
renderer.setAnimationLoop(() => { if (auto) yaw += 0.006;
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 0.5 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(0, 0.45, 0);
  renderer.render(scene, cam); });
pick(0);
</script></body></html>
