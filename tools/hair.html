<!doctype html><body style="margin:0;background:#2a1a1e"><script type="module">
import * as THREE from '../three.module.min.js'; import { loadHumans } from '../characters/base-human-v2/humans.js';
const q = new URLSearchParams(location.search), G = q.get('g') || 'm', V = +(q.get('v') || 0);
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x3a2a30); S.add(new THREE.HemisphereLight(0xfff0e0, 0x302020, 1.4)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 4, 5); S.add(d);
const H = await loadHumans(THREE, '../characters/base-human-v2/'); const hs = [...new Set(H.HAIR[G])]; const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 100);
hs.forEach((st, i) => { const h = H.make({ g: G, outfit: 'tee_jeans', skin: 1, hair: st, hairCol: H.HAIR_COLS[(i * 2 + 3) % 9] }); h.object.position.x = i * .6; h.object.rotation.y = [0, Math.PI, Math.PI / 2, 0][V]; S.add(h.object); h.play('Idle_Loop', 0); h.mixer.setTime(.5); h.mixer.update(0); });
const cx = (hs.length - 1) * .3; if (V === 3) { cam.position.set(cx, 3.2, .6); cam.lookAt(cx, 1.6, 0); } else { cam.position.set(cx, 1.65, 3.6); cam.lookAt(cx, 1.6, 0); } R.render(S, cam); document.title = 'ready';
</script></body>
