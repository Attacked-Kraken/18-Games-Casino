<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer - 18 Games Casino</title>
<style>
  body { margin:0; background:#1a1a1a; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; }
  #info { position:fixed; top:10px; left:10px; background:#000c; padding:12px 16px; border-radius:10px; max-width:320px; z-index:10; }
  #info h3 { margin:0 0 8px 0; }
  #info p { margin:4px 0; font-size:13px; color:#ccc; }
  #status { font-weight:bold; color:#ffb200; }
  canvas { display:block; }
</style>
<script type="importmap">
{ "imports": { "three": "../three.module.min.js" } }
</script>
</head>
<body>
<div id="info">
  <h3 id="modelName">3D Model Viewer</h3>
  <p id="modelDesc">Drag to rotate, scroll to zoom</p>
  <p>Status: <span id="status">WAITING OWNER</span></p>
</div>
<script type="module">
import * as THREE from 'three';

const params = new URLSearchParams(location.search);
const modelFile = params.get('model') || '../models/motorcycle-main.mjs';
const modelName = params.get('name') || 'Main Motorcycle (JOB J2)';
const modelDesc = params.get('desc') || 'Sport motorcycle - procedural, original design';

document.getElementById('modelName').textContent = modelName;
document.getElementById('modelDesc').textContent = modelDesc + ' — drag to rotate, scroll to zoom';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a35);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 2, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(5, 10, 5);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x3a3a45, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Grid for scale reference
const grid = new THREE.GridHelper(20, 20, 0x555555, 0x444444);
grid.position.y = 0.01;
scene.add(grid);

try {
  const mod = await import(modelFile);
  const builder = mod.buildMotorcycle || mod.buildModel || mod.default;
  if (!builder) throw new Error('No builder function found in ' + modelFile);
  const result = builder();
  const group = result.group || result;
  scene.add(group);
  window._model = result;
} catch(e) {
  document.getElementById('modelDesc').textContent = 'Error loading model: ' + e.message;
}

let theta = 0.7, phi = 1.15, radius = 7;
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - lx) * 0.01;
  phi = Math.max(0.15, Math.min(1.55, phi - (e.clientY - ly) * 0.01));
  lx = e.clientX; ly = e.clientY;
});
addEventListener('pointerup', () => dragging = false);
renderer.domElement.addEventListener('wheel', e => {
  radius = Math.max(2.5, Math.min(20, radius + e.deltaY * 0.01));
  e.preventDefault();
}, { passive:false });

function animate() {
  requestAnimationFrame(animate);
  camera.position.set(
    Math.sin(theta) * Math.sin(phi) * radius,
    Math.cos(phi) * radius,
    Math.cos(theta) * Math.sin(phi) * radius
  );
  camera.lookAt(0, 0.8, 0);
  if (window._model && window._model.wheels) {
    for (const w of window._model.wheels) w.rotation.x += 0.03;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
