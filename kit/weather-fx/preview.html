<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weather and Racing FX</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222;font-family:system-ui,sans-serif;color:#fff}#stage{position:fixed;left:0;right:0;top:0;height:58%}#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:fixed;left:0;right:0;bottom:0;top:58%;overflow:auto;background:#0d1226;padding:8px 8px 30px}.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.b{border:0;border-radius:12px;background:#3b9cff;color:#fff;font:700 12px system-ui;padding:8px 9px;box-shadow:0 3px 0 #1f6fc4;margin:0 4px 6px 0}.b.w{background:#9b5cff;box-shadow:0 3px 0 #6a35c4}.b.on{background:#46c94f;box-shadow:0 1px 0 #2e9636;transform:translateY(2px)}.b.k{background:#5b6584;box-shadow:0 3px 0 #3a4260}
h3{margin:6px 0;font-size:13px;color:#ffd23f}#hint{position:fixed;left:8px;top:8px;font-size:12px;background:#0008;padding:4px 8px;border-radius:8px;pointer-events:none}</style></head><body>
<div id="stage"><canvas id="bgc"></canvas><canvas id="fxc"></canvas><div id="hint">Tap the road to play the selected effect there</div></div>
<div id="ui"><div class="top"><button class="b k" id="snd">Sound: off</button><button class="b k" id="car">Drifting car: on</button><button class="b k" id="clr">Clear skid marks</button><button class="b k" id="stopw">Stop weather</button><button class="b k" id="all">Play all</button></div>
<h3>Weather (keeps running)</h3><div id="wx"></div><h3>Racing and one-shots</h3><div id="one"></div></div>
<script>/* Apex Effects: drop-in canvas particle / FX engine. No dependencies, no image files needed
   (all particle textures are drawn procedurally at startup; PNGs in textures/ are for other engines).
   const fx = new ApexFX(canvas);  fx.play('explosion_medium', x, y);  call fx.update(dt); fx.draw(); each frame,
   or fx.autoLoop() to let it run its own requestAnimationFrame.  ApexFX.list() -> all effect names. */
(function (root) {
  'use strict';
  const R = (a, b) => a + Math.random() * (b - a), TAU = Math.PI * 2, pick = a => a[(Math.random() * a.length) | 0];
  const lerp = (a, b, t) => a + (b - a) * t;
  // ---------- procedural textures ----------
  function mk(s, f) { const c = document.createElement('canvas'); c.width = c.height = s; f(c.getContext('2d'), s); return c; }
  const TEX = {};
  function buildTextures() {
    TEX.glow = mk(64, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });
    TEX.smoke = mk(64, (g, s) => { for (let i = 0; i < 14; i++) { const x = R(18, 46), y = R(18, 46), rr = R(8, 20), r = g.createRadialGradient(x, y, 0, x, y, rr); r.addColorStop(0, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); } });
    TEX.star = mk(64, (g, s) => { g.translate(s / 2, s / 2); g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? 11 : 30; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.fill(); });
    TEX.flare = mk(64, (g, s) => { g.drawImage(TEX.glow, 0, 0); g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(s / 2 - 1, 2, 2, s - 4); g.fillRect(2, s / 2 - 1, s - 4, 2); });
    TEX.ring = mk(64, (g, s) => { g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.arc(s / 2, s / 2, 26, 0, TAU); g.stroke(); });
    TEX.bubble = mk(64, (g, s) => { g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 3; g.beginPath(); g.arc(32, 32, 27, 0, TAU); g.stroke(); g.fillStyle = 'rgba(255,255,255,.18)'; g.fill(); g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.ellipse(22, 20, 6, 4, -0.6, 0, TAU); g.fill(); });
    TEX.drop = mk(64, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.moveTo(32, 6); g.bezierCurveTo(52, 34, 46, 58, 32, 58); g.bezierCurveTo(18, 58, 12, 34, 32, 6); g.fill(); });
    TEX.leaf = mk(64, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.moveTo(8, 32); g.quadraticCurveTo(32, 2, 56, 32); g.quadraticCurveTo(32, 62, 8, 32); g.fill(); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(8, 32); g.lineTo(56, 32); g.stroke(); });
    TEX.snow = mk(64, (g, s) => { g.translate(32, 32); g.strokeStyle = '#fff'; g.lineWidth = 3; g.lineCap = 'round'; for (let i = 0; i < 6; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 26); g.moveTo(0, 14); g.lineTo(7, 20); g.moveTo(0, 14); g.lineTo(-7, 20); g.stroke(); } });
    TEX.heart = mk(64, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.moveTo(32, 54); g.bezierCurveTo(4, 34, 10, 8, 32, 20); g.bezierCurveTo(54, 8, 60, 34, 32, 54); g.fill(); });
    TEX.plus = mk(64, (g) => { g.fillStyle = '#fff'; g.fillRect(24, 8, 16, 48); g.fillRect(8, 24, 48, 16); });
    TEX.coin = mk(64, (g) => { const r = g.createLinearGradient(0, 0, 64, 64); r.addColorStop(0, '#fff3a0'); r.addColorStop(.5, '#ffc61a'); r.addColorStop(1, '#c97a00'); g.fillStyle = r; g.beginPath(); g.arc(32, 32, 28, 0, TAU); g.fill(); g.strokeStyle = '#a45f00'; g.lineWidth = 4; g.stroke(); g.fillStyle = 'rgba(255,255,255,.75)'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('C', 32, 34); });
    TEX.square = mk(16, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 16, 16); });
    TEX.spark = mk(64, (g) => { const r = g.createLinearGradient(0, 32, 64, 32); r.addColorStop(0, 'rgba(255,255,255,0)'); r.addColorStop(.7, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 28, 64, 8); });
  }
  const tint = {}; // cached tinted copies
  function tinted(name, color) {
    const k = name + color; if (tint[k]) return tint[k]; const src = TEX[name];
    const c = mk(src.width, g => { g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, src.width, src.width); });
    return (tint[k] = c);
  }
  // ---------- engine ----------
  class ApexFX {
    constructor(canvas, { maxParticles = 2500, dprCap = 2 } = {}) {
      if (!TEX.glow) buildTextures();
      this.c = canvas; this.g = canvas.getContext('2d'); this.p = []; this.fx = []; this.max = maxParticles; this.shake = 0; this.shakeT = 0; this.flash = null; this.dprCap = dprCap; this.time = 0; this.reduced = false;
      this.resize(); addEventListener('resize', () => this.resize());
    }
    resize() { const d = Math.min(devicePixelRatio || 1, this.dprCap); this.dpr = d; this.w = this.c.clientWidth || innerWidth; this.h = this.c.clientHeight || innerHeight; this.c.width = this.w * d; this.c.height = this.h * d; }
    static list() { return Object.keys(PRESETS); }
    static info(n) { return PRESETS[n] && PRESETS[n].desc; }
    play(name, x = this.w / 2, y = this.h / 2, opts = {}) { const f = PRESETS[name]; if (!f) { console.warn('ApexFX: no effect', name); return; } f.fn(this, x, y, opts); if (this.onPlay) this.onPlay(name); }
    emit(o) { if (this.p.length >= this.max) this.p.shift(); const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, drag: 0, life: 1, t: 0, s0: 8, s1: 0, a0: 1, a1: 0, rot: 0, spin: 0, tex: 'glow', color: '#fff', add: true, stretch: 0, wob: 0 }, o); this.p.push(p); return p; }
    burst(n, x, y, f) { for (let i = 0; i < n; i++) this.emit(Object.assign({ x, y }, f(i))); }
    addFX(o) { this.fx.push(Object.assign({ t: 0, life: 1 }, o)); }
    screenShake(power = 10, time = 0.35) { this.shake = Math.max(this.shake, power); this.shakeT = Math.max(this.shakeT, time); }
    hitFlash(color = '#fff', time = 0.15, alpha = 0.6) { this.flash = { color, time, t: 0, alpha }; }
    clear() { this.p.length = 0; this.fx.length = 0; }
    update(dt) {
      dt = Math.min(dt, 0.05); this.time += dt;
      for (let i = this.p.length - 1; i >= 0; i--) { const p = this.p[i]; p.t += dt; if (p.t >= p.life) { this.p.splice(i, 1); continue; }
        p.vx += p.ax * dt; p.vy += p.ay * dt; if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
        if (p.wob) p.vx += Math.sin(this.time * 3 + p.s0) * p.wob * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt; }
      for (let i = this.fx.length - 1; i >= 0; i--) { const f = this.fx[i]; f.t += dt; if (f.tick) f.tick(this, f, dt); if (f.t >= f.life) this.fx.splice(i, 1); }
      if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shake = 0; }
      if (this.flash) { this.flash.t += dt; if (this.flash.t > this.flash.time) this.flash = null; }
    }
    // draw particles on top of whatever the game drew (pass clear=true to wipe first)
    draw(clear = true) {
      const g = this.g, d = this.dpr; g.setTransform(d, 0, 0, d, 0, 0); if (clear) g.clearRect(0, 0, this.w, this.h);
      if (this.shake > 0) { const k = this.shake * (this.shakeT / 0.35); g.translate(R(-k, k), R(-k, k)); }
      for (const f of this.fx) if (f.under) f.draw(g, f, this);
      for (const p of this.p) { const u = p.t / p.life, s = lerp(p.s0, p.s1, u), a = lerp(p.a0, p.a1, p.fadeIn ? Math.min(1, u * 4) * u : u) * (p.fadeIn ? Math.min(1, u * 5) : 1);
        if (a <= 0.003 || s <= 0.1) continue; g.globalAlpha = Math.min(1, a); g.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
        if (p.text) { g.save(); g.translate(p.x, p.y); const pop = p.pop ? 1 + 0.6 * Math.max(0, 1 - u * 6) : 1; g.scale(pop, pop); g.font = `900 ${s}px system-ui,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = Math.max(3, s / 7); g.strokeStyle = p.stroke || 'rgba(0,0,0,.65)'; g.strokeText(p.text, 0, 0); g.fillStyle = p.color; g.fillText(p.text, 0, 0); g.restore(); continue; }
        const img = p.color === '#fff' ? TEX[p.tex] : tinted(p.tex, p.color);
        if (p.stretch) { const sp = Math.hypot(p.vx, p.vy), ang = Math.atan2(p.vy, p.vx), L = Math.max(s, sp * p.stretch); g.save(); g.translate(p.x, p.y); g.rotate(ang); g.drawImage(TEX.spark === img ? img : img, -L / 2, -s / 4, L, s / 2); g.restore(); }
        else if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.drawImage(img, -s / 2, -s / 2, s, s); g.restore(); }
        else g.drawImage(img, p.x - s / 2, p.y - s / 2, s, s); }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      for (const f of this.fx) if (!f.under && f.draw) f.draw(g, f, this);
      if (this.flash) { g.setTransform(d, 0, 0, d, 0, 0); g.globalAlpha = this.flash.alpha * (1 - this.flash.t / this.flash.time); g.fillStyle = this.flash.color; g.fillRect(0, 0, this.w, this.h); g.globalAlpha = 1; }
    }
    autoLoop(before) { let last = performance.now(); const f = t => { requestAnimationFrame(f); const dt = (t - last) / 1000; last = t; this.update(dt); if (before) before(this.g, dt); this.draw(!before); }; requestAnimationFrame(f); }
  }
  // ---------- helpers for presets ----------
  const radial = (sp0, sp1) => { const a = R(0, TAU), v = R(sp0, sp1); return { vx: Math.cos(a) * v, vy: Math.sin(a) * v }; };
  const ringFX = (fx, x, y, { color = '#fff', r0 = 5, r1 = 120, life = 0.5, width = 8 } = {}) => fx.addFX({ life, draw(g, f) { const u = f.t / f.life; g.globalCompositeOperation = 'lighter'; g.globalAlpha = 1 - u; g.strokeStyle = color; g.lineWidth = width * (1 - u) + 1; g.beginPath(); g.arc(x, y, lerp(r0, r1, 1 - Math.pow(1 - u, 3)), 0, TAU); g.stroke(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; } });
  const textPop = (fx, x, y, text, color, size = 34, life = 1, vy = -60) => fx.emit({ x, y, vy, drag: 2, life, text, color, s0: size, s1: size, a0: 1.6, a1: 0, add: false, pop: true });
  function explosion(fx, x, y, k, colors = ['#fff6c0', '#ffb030', '#ff5a1f', '#c02000']) {
    fx.burst(Math.round(12 * k), x, y, () => Object.assign(radial(30 * k, 160 * k), { life: R(.3, .7), s0: R(30, 60) * k, s1: R(60, 110) * k, tex: 'glow', color: pick(colors), drag: 3 }));
    fx.burst(Math.round(26 * k), x, y, () => Object.assign(radial(150 * k, 420 * k), { life: R(.3, .8), s0: R(6, 12) * Math.sqrt(k), s1: 0, tex: 'spark', stretch: .06, color: pick(['#fff3b0', '#ffc040']), drag: 2.5, ay: 200 }));
    fx.burst(Math.round(10 * k), x, y, () => Object.assign(radial(20 * k, 90 * k), { life: R(.9, 1.8), s0: R(30, 50) * k, s1: R(90, 150) * k, tex: 'smoke', color: '#555', add: false, a0: .7, drag: 1.5, vy: -R(10, 40), fadeIn: true }));
    ringFX(fx, x, y, { color: '#ffd080', r1: 90 * k, life: .4, width: 10 * Math.sqrt(k) }); fx.screenShake(4 + 6 * k, .25 + .1 * k); if (k >= 1.5) fx.hitFlash('#fff2c0', .18, .45);
  }
  const fountain = (fx, x, y, n, spread, f) => fx.burst(n, x, y, i => Object.assign({ vx: R(-spread, spread), vy: R(-1, -.6) * spread * 2 }, f(i)));
  const loopFX = (fx, life, rate, spawn) => { let acc = 0; fx.addFX({ life, tick(fx, f, dt) { acc += dt * rate; while (acc >= 1) { acc--; spawn(f.t / life); } } }); };
  const RAINBOW = ['#ff3b5c', '#ffb12b', '#ffe94a', '#4ade80', '#38bdf8', '#a78bfa', '#f472b6'];
  // ---------- presets ----------
  const PRESETS = {};
  const def = (name, desc, fn) => PRESETS[name] = { desc, fn };
  def('sparkle', 'twinkling sparkles', (fx, x, y, o) => fx.burst(18, x, y, () => Object.assign(radial(10, 90), { life: R(.4, 1), s0: R(10, 22), s1: 0, tex: 'flare', color: o.color || pick(['#fff', '#fff7b0', '#bfe9ff']), spin: R(-3, 3), drag: 2 })));
  def('sparkle_burst', 'big sparkle ring', (fx, x, y) => { fx.burst(40, x, y, i => { const a = i / 40 * TAU; return { vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, drag: 3, life: .8, s0: 18, s1: 0, tex: 'flare', color: pick(['#fff', '#ffe680']) }; }); ringFX(fx, x, y, { color: '#fff2a0', r1: 80 }); });
  def('explosion_small', 'small explosion', (fx, x, y) => explosion(fx, x, y, .6));
  def('explosion_medium', 'medium explosion', (fx, x, y) => explosion(fx, x, y, 1));
  def('explosion_large', 'large explosion + flash', (fx, x, y) => explosion(fx, x, y, 1.7));
  def('explosion_huge', 'huge explosion, double blast', (fx, x, y) => { explosion(fx, x, y, 2.3); setTimeout(() => explosion(fx, x + R(-40, 40), y + R(-30, 30), 1.2), 160); });
  def('explosion_blue', 'blue energy explosion', (fx, x, y) => explosion(fx, x, y, 1.1, ['#e0f7ff', '#7dd3fc', '#3b82f6', '#1e3a8a']));
  def('explosion_green', 'green toxic explosion', (fx, x, y) => explosion(fx, x, y, 1.1, ['#f0ffe0', '#a3e635', '#22c55e', '#14532d']));
  def('confetti', 'confetti shower', (fx, x, y) => fountain(fx, x, y, 90, 260, () => ({ life: R(1.5, 2.6), s0: R(7, 12), s1: R(6, 10), a1: .6, tex: 'square', color: pick(RAINBOW), add: false, ay: 380, drag: 1.6, spin: R(-12, 12), rot: R(0, 6), wob: 60 })));
  def('confetti_rain', 'confetti from the top of the screen', (fx) => fx.burst(140, 0, 0, () => ({ x: R(0, fx.w), y: R(-200, -10), vy: R(60, 160), vx: R(-30, 30), life: R(3, 4.5), s0: R(7, 12), s1: 8, a1: .8, tex: 'square', color: pick(RAINBOW), add: false, spin: R(-10, 10), rot: 1, wob: 80 })));
  def('smoke_puff', 'smoke puff', (fx, x, y) => fx.burst(12, x, y, () => Object.assign(radial(10, 60), { life: R(.8, 1.6), s0: 20, s1: R(60, 90), tex: 'smoke', color: '#9aa0a6', add: false, a0: .8, drag: 2, vy: -R(10, 30), fadeIn: true })));
  def('smoke_column', 'rising smoke column', (fx, x, y) => loopFX(fx, 2.5, 30, () => fx.emit({ x: x + R(-8, 8), y, vy: -R(40, 80), vx: R(-10, 20), life: R(1.5, 2.5), s0: 16, s1: R(70, 110), tex: 'smoke', color: '#6b7280', add: false, a0: .6, fadeIn: true, wob: 20 })));
  def('dust', 'dust kick-up', (fx, x, y) => fx.burst(16, x, y, () => ({ vx: R(-140, 140), vy: R(-80, -10), ay: 120, drag: 3, life: R(.5, 1), s0: R(8, 14), s1: R(26, 40), tex: 'smoke', color: '#c8a77a', add: false, a0: .8 })));
  def('landing_dust', 'landing dust ring', (fx, x, y) => fx.burst(20, x, y, i => ({ vx: (i % 2 ? 1 : -1) * R(80, 220), vy: R(-30, 0), drag: 4, life: R(.4, .8), s0: 10, s1: 34, tex: 'smoke', color: '#d6c4a8', add: false, a0: .9 })));
  def('fire', 'burning fire (2.5 s)', (fx, x, y) => loopFX(fx, 2.5, 70, u => fx.emit({ x: x + R(-14, 14), y, vy: -R(80, 160), vx: R(-15, 15), life: R(.4, .8), s0: R(22, 34), s1: 4, tex: 'glow', color: pick(['#ffe08a', '#ff9a2e', '#ff5a1f']), wob: 40 })));
  def('fireball', 'fireball trail burst', (fx, x, y) => { fx.burst(30, x, y, () => Object.assign(radial(20, 200), { life: R(.3, .6), s0: R(18, 30), s1: 0, tex: 'glow', color: pick(['#fff3c0', '#ffa030', '#ff4010']), drag: 2 })); fx.screenShake(4, .2); });
  def('sparks', 'metal sparks', (fx, x, y) => fx.burst(30, x, y, () => ({ vx: R(-260, 260), vy: R(-340, -40), ay: 900, life: R(.3, .7), s0: R(6, 10), s1: 2, tex: 'spark', stretch: .05, color: pick(['#fff7d0', '#ffd060', '#ff9a20']) })));
  def('grind_sparks', 'continuous grinding sparks', (fx, x, y) => loopFX(fx, 1.5, 120, () => fx.emit({ x, y, vx: R(-380, -120), vy: R(-200, 40), ay: 900, life: R(.2, .5), s0: 7, s1: 2, tex: 'spark', stretch: .05, color: pick(['#fff7d0', '#ffc040']) })));
  def('electricity', 'electric arcs', (fx, x, y) => { for (let k = 0; k < 4; k++) fx.addFX({ life: .45, seed: Math.random(), draw(g, f) { const u = f.t / f.life; g.globalCompositeOperation = 'lighter'; g.strokeStyle = '#9fe8ff'; g.shadowColor = '#3ad1ff'; g.shadowBlur = 12; g.lineWidth = 2.5 * (1 - u) + .5; g.globalAlpha = Math.random() < .2 ? .3 : 1 - u; g.beginPath(); const a = f.seed * TAU + k, L = 110; let px = x, py = y; g.moveTo(px, py); for (let i = 1; i <= 8; i++) { px = x + Math.cos(a) * L * i / 8 + R(-14, 14); py = y + Math.sin(a) * L * i / 8 + R(-14, 14); g.lineTo(px, py); } g.stroke(); g.shadowBlur = 0; g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; } }); fx.burst(12, x, y, () => Object.assign(radial(60, 220), { life: .3, s0: 8, s1: 0, tex: 'glow', color: '#9fe8ff' })); fx.hitFlash('#bfefff', .1, .25); });

  def('skid_mark', 'skid marks that stay (opts: angle, length, width, gap)', (fx, x, y, o) => { const a = o.angle || 0, L = o.length || 120, w = o.width || 9, gap = o.gap == null ? 26 : o.gap, nx = -Math.sin(a) * gap / 2, ny = Math.cos(a) * gap / 2, dx = Math.cos(a) * L, dy = Math.sin(a) * L;
    let t = 0; fx.addFX({ life: .45, tick(fx, f, dt) { const t2 = Math.min(1, f.t / f.life); [1, -1].forEach(s => fx.skidLine(x + nx * s + dx * t, y + ny * s + dy * t, x + nx * s + dx * t2, y + ny * s + dy * t2, w, .45)); t = t2; } }); SPAWN.tire_smoke(fx, x + dx, y + dy, {}); }, 'skid_short');
  def('skid_drift', 'curved drift skid marks that stay', (fx, x, y, o) => { const r = o.radius || 110, a0 = o.angle || -Math.PI / 2, sweep = o.sweep || 1.6; let last = null;
    fx.addFX({ life: .8, tick(fx, f) { const u = Math.min(1, f.t / f.life), a = a0 + sweep * u, pts = [[x + Math.cos(a) * r, y + Math.sin(a) * r], [x + Math.cos(a) * (r + 26), y + Math.sin(a) * (r + 26)]];
      if (last) pts.forEach((p, i) => fx.skidLine(last[i][0], last[i][1], p[0], p[1], 10, .4)); last = pts; if (Math.random() < .5) SPAWN.tire_smoke(fx, pts[1][0], pts[1][1], {}); } }); }, 'skid_long');
  def('dirt_spray', 'dirt clods + dust thrown back (opts: angle)', burstOf('dirt_spray', 60, .5), 'dirt_spray');
  def('gravel_spray', 'grey gravel spray', (fx, x, y, o) => burstOf('dirt_spray', 50, .4)(fx, x, y, Object.assign({}, o, { color: '#9a948a' })), 'gravel_spray');
  def('mud_splash', 'wet mud splash', (fx, x, y, o) => { for (let i = 0; i < 40; i++) fx.emit(Object.assign(dirV(o, -Math.PI / 2, 120, 360), { x, y, ay: 800, life: R(.5, .9), s0: R(5, 10), s1: R(6, 12), tex: 'glow', color: pick(['#4a3220', '#5e4028', '#3a2818']), add: false, a0: 1 })); }, 'puddle_splash');
  def('sparks', 'spark shower (opts: angle, spread)', burstOf('sparks', 50), 'sparks_scrape');
  def('sparks_scrape', 'sparks for 1 s, like scraping a wall', burstOf('sparks', 120, 1), 'metal_scrape_long');
  def('puddle_splash', 'puddle splash: crown + droplets + ripple', (fx, x, y) => { for (let i = 0; i < 36; i++) { const a = -Math.PI / 2 + R(-1.1, 1.1), v = R(120, 340); fx.emit({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ay: 900, life: R(.4, .8), s0: R(3, 7), s1: R(2, 4), tex: 'drop', color: '#cfe6ff', add: false, a0: .9 }); }
    fx.addFX({ life: .8, under: true, draw(g, f) { const u = f.t / f.life; g.save(); g.globalAlpha = (1 - u) * .7; g.strokeStyle = '#e6f2ff'; g.lineWidth = 3 * (1 - u) + 1; g.beginPath(); g.ellipse(x, y, 10 + u * 70, 4 + u * 22, 0, 0, TAU); g.stroke(); g.restore(); } }); }, 'puddle_splash');
  def('water_spray', 'water spray behind a wheel for 1 s (opts: angle)', burstOf('water_spray', 70, 1), 'wet_tires_loop');
  def('rain_splashes', 'little ground splashes in an area for 2 s', (fx, x, y) => { let acc = 0; fx.addFX({ life: 2, tick(fx, f, dt) { acc += dt * 40; while (acc >= 1) { acc--; splashAt(fx, x + R(-120, 120), y + R(-30, 30), 3); } } }); }, 'rain_light_loop');
  def('dust_cloud', 'big brown dust cloud', (fx, x, y, o) => { for (let i = 0; i < 26; i++) smokePuff(fx, x + R(-30, 30), y, Object.assign({}, o, { color: '#b39270' }), 1.3); }, 'dirt_spray');
})();
</script>
<script>
var bg=document.getElementById('bgc'),bx=bg.getContext('2d'),fc=document.getElementById('fxc'),fx=new ApexFX(fc),sel='sparks',sound=false,carOn=true,emit=null,cur=null;
function snd(n){if(!sound||!n)return;var f=ApexFX.sound(n)||n;var a=new Audio('Weather-Racing-FX-Sounds/'+f+'.mp3');a.loop=/_loop$/.test(f)&&ApexFX.weatherList().indexOf(n)>=0&&/rain|snow|fog|wind|blizzard/.test(n);if(a.loop){if(cur)cur.pause();cur=a}a.play().catch(function(){})}
fx.onWeatherSound=snd;
var WX=['rain_light','rain','rain_heavy','rain_storm','snow_light','snow','blizzard','fog','fog_heavy','wind','wind_leaves'];
var ONE=ApexFX.weatherList().filter(function(n){return WX.indexOf(n)<0&&n!=='weather_stop'});
function btns(id,list,w){document.getElementById(id).innerHTML=list.map(function(n){return '<button class="b'+(w?' w':'')+'" data-n="'+n+'" title="'+ApexFX.info(n)+'">'+n.replace(/_/g,' ')+'</button>'}).join('')}
btns('wx',WX,1);btns('one',ONE,0);
function W(){return fx.w}function H(){return fx.h}
document.getElementById('ui').onclick=function(e){var b=e.target.closest('[data-n]');if(!b)return;var n=b.dataset.n;
 if(WX.indexOf(n)>=0){document.querySelectorAll('#wx .b').forEach(function(x){x.classList.toggle('on',x===b)});fx.play(n,null,null,{prewarm:2});snd(n);return}
 sel=n;document.querySelectorAll('#one .b').forEach(function(x){x.classList.toggle('on',x===b)});playAt(n,W()/2,H()*.6)};
function playAt(n,x,y){var o={};if(/sparks|dirt|gravel|water/.test(n))o.angle=Math.PI*1.15;if(n==='skid_mark')o.angle=-.3;fx.play(n,x,y,o);snd(n)}
fc.addEventListener('pointerdown',function(e){var r=fc.getBoundingClientRect();playAt(sel,e.clientX-r.left,e.clientY-r.top)});
document.getElementById('snd').onclick=function(){sound=!sound;this.textContent='Sound: '+(sound?'on':'off');if(!sound&&cur){cur.pause();cur=null}};
document.getElementById('car').onclick=function(){carOn=!carOn;this.textContent='Drifting car: '+(carOn?'on':'off');setCar()};
document.getElementById('clr').onclick=function(){fx.skidClear()};document.getElementById('stopw').onclick=function(){fx.stopWeather();if(cur){cur.pause();cur=null}document.querySelectorAll('#wx .b').forEach(function(x){x.classList.remove('on')})};
document.getElementById('all').onclick=function(){ONE.forEach(function(n,i){setTimeout(function(){playAt(n,W()*(.2+.6*Math.random()),H()*(.35+.4*Math.random()))},i*500)})};
var car={a:0,x:0,y:0,px:0,py:0};function carPos(){return [car.x,car.y]}
function setCar(){if(emit){emit.stop();emit=null}if(carOn)emit=fx.emitter('tire_smoke',function(){return [car.rx,car.ry]},{rate:22})}
function road(){var w=bg.width=fx.w*fx.dpr,h=bg.height=fx.h*fx.dpr;bx.setTransform(fx.dpr,0,0,fx.dpr,0,0);bx.fillStyle='#3a3b3f';bx.fillRect(0,0,fx.w,fx.h);
 for(var i=0;i<1400;i++){bx.fillStyle='rgba(255,255,255,'+(Math.random()*.05)+')';bx.fillRect(Math.random()*fx.w,Math.random()*fx.h,2,2)}
 bx.fillStyle='#46a34a';bx.fillRect(0,0,fx.w,18);bx.fillRect(0,fx.h-18,fx.w,18);for(var x=0;x<fx.w;x+=24){bx.fillStyle=(x/24)%2?'#d82828':'#f0f0f0';bx.fillRect(x,18,24,8);bx.fillRect(x,fx.h-26,24,8)}}
road();addEventListener('resize',function(){setTimeout(road,50)});
var last=performance.now();
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;
 if(carOn){car.a+=dt*1.6;var cx=fx.w/2,cy=fx.h*.55,r=Math.min(fx.w,fx.h)*.28,nx=cx+Math.cos(car.a)*r*1.3,ny=cy+Math.sin(car.a)*r*.8;var ang=Math.atan2(ny-car.y,nx-car.x);
  if(car.x){var bxp=car.x-Math.cos(ang)*14,byp=car.y-Math.sin(ang)*14,ox=-Math.sin(ang)*9,oy=Math.cos(ang)*9;if(car.lbx!=null){fx.skidLine(car.lbx+ox,car.lby+oy,bxp+ox,byp+oy,5,.22);fx.skidLine(car.lbx-ox,car.lby-oy,bxp-ox,byp-oy,5,.22)}car.lbx=bxp;car.lby=byp;car.rx=bxp;car.ry=byp}
  car.x=nx;car.y=ny;car.ang=ang+.5}
 fx.update(dt);fx.draw(true);if(carOn){var g=fx.g;g.save();g.translate(car.x,car.y);g.rotate(car.ang);g.fillStyle='#ff4b5f';g.beginPath();g.roundRect?g.roundRect(-18,-10,36,20,6):g.rect(-18,-10,36,20);g.fill();g.fillStyle='#bfe6ff';g.fillRect(2,-7,8,14);g.fillStyle='#111';[-12,10].forEach(function(x){g.fillRect(x,-12,7,4);g.fillRect(x,8,7,4)});g.restore()}
 requestAnimationFrame(frame)}
setCar();requestAnimationFrame(frame);
var hsh=location.hash.slice(1);if(hsh){hsh.split(',').forEach(function(n,i){setTimeout(function(){if(WX.indexOf(n)>=0)fx.play(n,null,null,{prewarm:5});else playAt(n,fx.w*(.3+.4*i/3),fx.h*.5)},i*80)})}
</script></body></html>
