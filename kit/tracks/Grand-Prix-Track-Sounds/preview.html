<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Grand Prix Track Sounds</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0d1226;color:#fff;padding:14px 14px 40px}

_bang_2.mp3", "loop": false, "seconds": 2.5, "source": "new", "desc": "burst", "group": "race event"}, {"file": "fireworks_crackle.mp3", "loop": false, "seconds": 2.0, "source": "new", "desc": "sparkle crackle", "group": "race event"}, {"file": "confetti_pop.mp3", "loop": false, "seconds": 0.7, "source": "new", "desc": "confetti cannon", "group": "race event"}, {"file": "helicopter_loop.mp3", "loop": true, "seconds": 2.0, "source": "new", "desc": "TV helicopter hovering, seamless", "group": "race event"}, {"file": "flag_flutter_loop.mp3", "loop": true, "seconds": 2.0, "source": "new", "desc": "marshal flag flutter", "group": "race event"}, {"file": "pa_chime.mp3", "loop": false, "seconds": 1.7, "source": "new", "desc": "announcement chime, no voice", "group": "race event"}, {"file": "podium_fanfare.mp3", "loop": false, "seconds": 2.15, "source": "new", "desc": "short original fanfare", "group": "race event"}, {"file": "car_pass_whoosh.mp3", "loop": false, "seconds": 1.2, "source": "new", "desc": "generic pass-by air whoosh for stands", "group": "race event"}],cur={};function nm(f){return f.split('/').pop().replace('.mp3','')}
var groups={};M.forEach(function(m){var g=m["'group'"]||'sounds';(groups[g]=groups[g]||[]).push(m)});
var h='';for(var g in groups){h+='<h2>'+g.replace(/_/g,' ')+'</h2><div class="g">'+groups[g].map(function(m){return '<button class="b'+(m.loop?' loop':'')+'" data-f="'+m.file+'" data-l="'+(m.loop?1:0)+'">'+(m.loop?'&#8635; ':'&#9654; ')+nm(m.file).replace(g+'_','').replace(/_/g,' ')+'</button>'}).join('')+'</div>'}
document.getElementById('list').innerHTML=h;
document.getElementById('list').onclick=function(e){var b=e.target.closest('[data-f]');if(!b)return;var f=b.dataset.f;
 if(cur[f]){cur[f].pause();delete cur[f];b.classList.remove('on');return}
 var a=new Audio(f);a.loop=b.dataset.l==='1';a.play().catch(function(){});cur[f]=a;b.classList.add('on');a.onended=function(){delete cur[f];b.classList.remove('on')}};
function stopAll(){for(var f in cur){cur[f].pause()}cur={};document.querySelectorAll('.b.on').forEach(function(b){b.classList.remove('on')});if(window.engStop)engStop()}
