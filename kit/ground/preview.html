<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Ground Textures</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#0d1226;color:#fff}header{padding:12px 14px;position:sticky;top:0;background:#0d1226ee;z-index:2}
h1{margin:0 0 6px;font-size:20px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}button{border:0;border-radius:12px;background:#3b9cff;color:#fff;font-weight:800;padding:8px 12px;box-shadow:0 3px 0 #1f6fc4}button.on{background:#ffd23f;color:#222;box-shadow:0 3px 0 #c9a21c}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px 14px}.t{border-radius:14px;overflow:hidden;background:#1a2142}.t div{height:170px;background-repeat:repeat}.t b{display:block;padding:6px 8px 0;font-size:13px}.t small{display:block;padding:0 8px 8px;opacity:.7;font-size:11px}
</style></head><body><header><h1>Apex Ground Textures</h1><div class="row">Each tile shows its texture repeated, so you can check the seams.
<button id="s1024" class="on">1024</button><button id="s512">512</button><button id="nm">Normal maps</button> Tile size <input type="range" id="sc" min="24" max="300" value="85"></div></header><div class="g" id="g"></div>
<script>var M=[{"name": "asphalt_plain", "desc": "fine dark asphalt"}, {"name": "asphalt_worn", "desc": "faded asphalt with cracks and patches"}, {"name": "asphalt_wet", "desc": "dark wet asphalt with puddles and shine"}, {"name": "kerb_red_white", "desc": "racing kerb, red and white blocks (tiles sideways)"}, {"name": "kerb_blue_white", "desc": "racing kerb, blue and white blocks"}, {"name": "kerb_green_white", "desc": "racing kerb, green and white blocks"}, {"name": "grass_plain", "desc": "short green grass"}, {"name": "pitch_stripes", "desc": "sports field grass with mowing stripes"}, {"name": "pitch_checker", "desc": "sports field grass with checker mowing"}, {"name": "grass_rough", "desc": "long rough grass"}, {"name": "dirt", "desc": "packed brown dirt"}, {"name": "dirt_tracks", "desc": "dirt with tire ruts (ruts run vertically)"}, {"name": "gravel", "desc": "loose grey gravel"}, {"name": "ice_rink", "desc": "smooth ice with skate scratches"}, {"name": "baseball_infield", "desc": "reddish infield clay"}, {"name": "baseball_dirt_dragged", "desc": "infield clay with drag marks"}, {"name": "running_track", "desc": "red running track, 4 lanes with white lines (lanes run vertically)"}, {"name": "running_track_plain", "desc": "red running track surface, no lines"}, {"name": "sand", "desc": "fine beach sand with ripples"}, {"name": "concrete", "desc": "light concrete with joints"}, {"name": "concrete_plain", "desc": "smooth concrete, no joints"}, {"name": "snow", "desc": "packed snow"}, {"name": "mud", "desc": "wet mud"}, {"name": "cobblestone", "desc": "rounded paving stones"}],size='1024',nrm=false;
function draw(){var px=document.getElementById('sc').value;document.getElementById('g').innerHTML=M.map(function(t){var f=nrm?'normal_512/'+t.name+'_normal.png':size+'/'+t.name+'.png';
 return '<div class="t"><div style="background-image:url('+f+');background-size:'+px+'px '+px+'px"></div><b>'+t.name+'</b><small>'+t.desc+'</small></div>'}).join('')}
document.getElementById('s1024').onclick=function(){size='1024';nrm=false;tog(this)};document.getElementById('s512').onclick=function(){size='512';nrm=false;tog(this)};document.getElementById('nm').onclick=function(){nrm=true;tog(this)};
function tog(b){document.querySelectorAll('header button').forEach(function(x){x.classList.toggle('on',x===b)});draw()}document.getElementById('sc').oninput=draw;draw();</script></body></html>
