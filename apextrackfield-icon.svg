<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b28"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff2a1e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stadium track oval -->
  <ellipse cx="256" cy="330" rx="190" ry="92" fill="none" stroke="url(#track)" stroke-width="46"/>
  <ellipse cx="256" cy="330" rx="190" ry="92" fill="none" stroke="#f2f4f8" stroke-width="6" stroke-dasharray="26 20" opacity="0.85"/>
  <!-- inner field -->
  <ellipse cx="256" cy="330" rx="120" ry="52" fill="#0e2a1a"/>
  <!-- sprinter silhouette -->
  <g fill="#f2f4f8">
    <circle cx="318" cy="128" r="30"/>
    <path d="M300 170 L262 210 L196 200 L188 232 L258 246 L278 300 L236 380 L268 392 L318 306 L352 330 L392 316 L384 284 L336 292 L310 240 L348 210 L336 178 Z"/>
  </g>
  <!-- motion speed lines -->
  <g stroke="#ffb200" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="150" x2="150" y2="150"/>
    <line x1="44" y1="205" x2="160" y2="205"/>
    <line x1="60" y1="260" x2="150" y2="260"/>
  </g>
  <!-- gold medal accent -->
  <circle cx="416" cy="110" r="44" fill="#ffb200"/>
  <circle cx="416" cy="110" r="30" fill="#c77f00"/>
  <text x="416" y="126" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#fff" text-anchor="middle">1</text>
  <!-- APEX wordmark -->
  <text x="256" y="478" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#f2f4f8" text-anchor="middle">APEX</text>
</svg>
