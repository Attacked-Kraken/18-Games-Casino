name: Game check

# Plays every Game Development title like a phone after each merge to main, and posts a picture
# report to the "game-checks" branch (open it on GitHub to see the README with all screenshots).
# On a PULL REQUEST it plays only the games the PR touches and FAILS the check (red X, merge blocked) if the PR
# adds a problem main doesn't already have - blob/box people, outside internet, real brands, casino words,
# "Your name" boxes, broken shaders, missing files, owner's fix tests. See STUDIO-STANDARD.md.
# Pull requests are checked SIDE BY SIDE by game-check-pr.yml (owner Oct 21 2026) - this file is main only.
# Owner Oct 21 2026 6:23 PM "needs to be faster": main is played side by side too - one robot per game (plan -> play
# matrix -> finish). A full check of all 11 games ~10-12 min instead of ~50; a merge that changed one game ~6-8 min.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 */4 * * *'   # full check of EVERY game every 4 h (main pushes only re-play the games they changed)
  workflow_dispatch:
    inputs:
      full:
        description: 'Play every game (not only the changed ones)'
        type: boolean
        default: false

concurrency:
  group: game-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a new push to the PR replaces its old check

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
      list: ${{ steps.pick.outputs.list }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick what main needs re-played (only the games that changed, or every game)
        id: pick
        run: |
          git fetch -q origin game-checks || true
          git show origin/game-checks:results.json > prev-results.json 2>/dev/null || echo '{}' > prev-results.json
          P=$(node -e "try{console.log(require('./prev-results.json').sha||'')}catch(e){console.log('')}")
          FULL=""
          [ "${{ github.event_name }}" = "schedule" ] && FULL="every 4 h"
          [ "${{ inputs.full }}" = "true" ] && FULL="asked by hand"
          [ -n "$P" ] || FULL="no last report"
          [ -n "$FULL" ] || git merge-base --is-ancestor "$P" HEAD 2>/dev/null || FULL="last report not on main"
          G=""
          if [ -z "$FULL" ]; then
            CH=$(git diff --name-only "$P" HEAD)
            echo "$CH"
            for f in $CH; do
              case "$f" in
                apex*.html) G="$G$f,";;
                tools/game-check/fixes/apex*.mjs) G="$G$(basename $f .mjs).html,";;
                MODELS.md) FULL="MODELS.md changed";;
                *.md|jobs/*|plans/*|reviews/*|looks/*|ideas/*|team/*|notes/*|needs/*) ;;
                .github/workflows/game-check.yml) FULL="robot changed";;
                .github/*) ;;
                *) FULL="shared file $f changed";;
              esac
              [ -n "$FULL" ] && break
            done
          fi
          if [ -n "$FULL" ]; then
            echo "FULL check: $FULL"
            G="$(node -e "console.log(require('./tools/game-check/games.json').games.map(g=>g.file).join(','))"),models,"
            echo "full=1" >> $GITHUB_OUTPUT
          else
            echo "FAST check since $P: ${G:-no game changed}"
            echo "full=" >> $GITHUB_OUTPUT
          fi
          LIST=$(echo "$G" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',')
          # owner Oct 23 2026 7:47 PM: Hockey (56 play tests) is split into 4 robots that each play a quarter of its tests (TEST_PART k/n)
          LIST=$(echo "$LIST" | sed 's/\bapexhockey\.html\b/apexhockey.html@1of4,apexhockey.html@2of4,apexhockey.html@3of4,apexhockey.html@4of4/')
          # owner Oct 24 2026 (item 6, per-step times: the 'Play <game>' step is 8-19 min, 55-75% of it is that game's play tests):
          # the long games are split like Hockey - part 1 plays everything else, the other parts only their share of the tests
          LIST=$(echo "$LIST" | sed 's/\bapexflight\.html\b/apexflight.html@1of3,apexflight.html@2of3,apexflight.html@3of3/; s/\bapexf1\.html\b/apexf1.html@1of3,apexf1.html@2of3,apexf1.html@3of3/; s/\bapextrackfield\.html\b/apextrackfield.html@1of3,apextrackfield.html@2of3,apextrackfield.html@3of3/; s/\bapexbaseball\.html\b/apexbaseball.html@1of2,apexbaseball.html@2of2/')
          JSON=$(echo "$LIST" | tr ',' '\n' | grep -v '^$' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.stringify(s.split('\n').filter(Boolean))))")
          echo "games=$JSON" >> $GITHUB_OUTPUT
          echo "list=$LIST" >> $GITHUB_OUTPUT

  play:
    needs: plan
    if: needs.plan.outputs.games != '[]'
    runs-on: ubuntu-24.04
    # owner Oct 23 2026 6:19 PM: the browser install failed 4 tries even after the apt fix (#1369's own run) - play jobs run INSIDE
    # Microsoft's official Playwright image: Chromium + WebKit + their system libraries are already in it, nothing to download.
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
      options: --ipc=host
    timeout-minutes: 55      # owner Oct 21: the 55-minute limit stays as the safety net
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        game: ${{ fromJson(needs.plan.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test browser (already in the image)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          ls /ms-playwright
      - name: Play ${{ matrix.game }}
        run: |
          node tools/game-check/serve.mjs 8811 >/dev/null 2>&1 &
          sleep 2
          if [ "${{ matrix.game }}" = "models" ]; then
            ONLY=none node tools/game-check/check.mjs http://127.0.0.1:8811/ game-check-out
          else
            M="${{ matrix.game }}"; GAME="${M%@*}"; PART=""
            case "$M" in *@*of*) P="${M#*@}"; PART="${P%of*}/${P#*of}";; esac
            ONLY="$GAME" TEST_PART="$PART" SKIP_MODELS=1 node tools/game-check/check.mjs http://127.0.0.1:8811/ game-check-out
          fi
      - name: iPhone Safari pass
        if: always() && matrix.game != 'models' && !contains(matrix.game, '@2of') && !contains(matrix.game, '@3of') && !contains(matrix.game, '@4of')
        continue-on-error: true
        run: |
          [ -f game-check-out/results.json ] || exit 0
          node tools/game-check/serve.mjs 8812 >/dev/null 2>&1 &
          sleep 2
          M="${{ matrix.game }}"; ONLY="${M%@*}" timeout 600 node tools/game-check/safari.mjs http://127.0.0.1:8812/ game-check-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-play-${{ strategy.job-index }}
          path: game-check-out
          if-no-files-found: ignore

  check:
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: main-play-*
          path: parts
      - name: Put the games back together + keep the last result for games that didn't change
        run: |
          git fetch -q origin game-checks || true
          git show origin/game-checks:results.json > prev-results.json 2>/dev/null || echo '{}' > prev-results.json
          mkdir -p old-checks
          git archive origin/game-checks 2>/dev/null | tar -x -C old-checks 2>/dev/null || true
          node tools/game-check/merge-results.mjs parts game-check-out "${{ needs.plan.outputs.list }}"
          node tools/game-check/report.mjs game-check-out
          if [ -z "${{ needs.plan.outputs.full }}" ]; then SKIP_MODELS=1 node tools/game-check/carry.mjs prev-results.json game-check-out old-checks;
          else node tools/game-check/carry.mjs prev-results.json game-check-out old-checks; fi

      - name: Auto-undo a merge that newly broke a game
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f game-check-out/results.json ] || exit 0
          MSG=$(git log -1 --format=%s $GITHUB_SHA)
          case "$MSG" in AUTO-UNDO*|Revert*) echo "this is an undo itself - leave it"; exit 0;; esac
          OUT=$(node tools/game-check/undo.mjs prev-results.json game-check-out/results.json)
          GAMES=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).games.join(',')))")
          [ -n "$GAMES" ] || { echo "nothing newly broken"; exit 0; }
          echo "Newly broken: $GAMES - checking once more to be sure it isn't a fluke"
          npm install --no-save --no-package-lock playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8813 >/dev/null 2>&1 &
          sleep 2
          ONLY="$GAMES" node tools/game-check/check.mjs http://127.0.0.1:8813/ recheck-out || true
          OUT=$(node tools/game-check/undo.mjs prev-results.json recheck-out/results.json)
          GAMES=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).games.join(',')))")
          WHY=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).why.join(' | ')))")
          [ -n "$GAMES" ] || { echo "it was a fluke - nothing undone"; exit 0; }
          # only undo THIS merge if it actually touched what broke (the game, its tests, or shared 3D/kit files)
          CH=$(git diff --name-only $GITHUB_SHA^1 $GITHUB_SHA)
          HIT=""
          for G in $(echo "$GAMES" | tr ',' ' '); do
            SL=${G%.html}
            if echo "$CH" | grep -qE "^($SL\.|tools/game-check/fixes/$SL\.|characters/|models/|venues/|kit/|vendor/|three\.module|look-presets|apex-gfx|audio\.js|sports\.html)"; then HIT="$HIT$G,"; fi
          done
          [ -n "$HIT" ] || { echo "broken ($GAMES) but this merge didn't touch it - not undoing (an earlier merge did it)"; exit 0; }
          GAMES=${HIT%,}
          git config user.name "auto-undo bot"; git config user.email "auto-undo-bot@users.noreply.github.com"
          git fetch -q origin main
          B="auto-undo-${GITHUB_SHA::7}"
          git checkout -q -B "$B" origin/main
          if [ $(git rev-list --parents -n1 $GITHUB_SHA | wc -w) -gt 2 ]; then R="-m 1"; else R=""; fi
          if ! git revert --no-edit $R $GITHUB_SHA; then git revert --abort || true; echo "couldn't undo cleanly - leaving it for the Muses"; exit 0; fi
          git commit --amend -q -m "AUTO-UNDO: ${GITHUB_SHA::7} newly broke $GAMES" -m "$WHY" -m "Undone by the game check robot. Fix it on your branch and merge again. (\"$MSG\")"
          git push -q origin "$B"
          N=$(gh api repos/${{ github.repository }}/pulls -f head="$B" -f base=main -f title="AUTO-UNDO: ${GITHUB_SHA::7} newly broke $GAMES" -f body="The game check robot undid this merge because it newly broke: $WHY. Checked twice. Fix it and merge again - see LESSONS.md." --jq .number)
          # owner Oct 21 2026: main is protected - the undo merges through the merge robot once its own check is green
          gh workflow run game-check-pr.yml --ref "$B" || true
          echo "::warning title=AUTO-UNDO::opened pull request #$N to undo ${GITHUB_SHA::7} - merges when its check is green"
          { echo; echo "## ⏪ AUTO-UNDO"; echo; echo "Merge \`${GITHUB_SHA::7}\` (\"$MSG\") was undone because it newly broke: $WHY"; } >> game-check-out/README.md
          gh workflow run game-check-pr.yml --ref main || true

      - name: Turn the gameplay flip-books into phone videos
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -d game-check-out/clips ] || exit 0
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          for d in game-check-out/clips/*/; do
            s=$(basename "$d")
            ls "$d"*.jpg >/dev/null 2>&1 || continue
            ffmpeg -loglevel error -y -framerate 4 -pattern_type glob -i "$d*.jpg" -vf "scale=844:-2" \
              -c:v libx264 -pix_fmt yuv420p -movflags +faststart "game-check-out/img/$s-clip.mp4" || true
          done
          rm -rf game-check-out/clips

      - name: Post the report to the game-checks branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -f game-check-out/README.md ] || exit 0
          cd game-check-out
          git init -q
          git checkout -q -b game-checks
          git config user.name "game-check bot"
          git config user.email "game-check-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Game check for main @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" game-checks
