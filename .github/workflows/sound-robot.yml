name: Sound robot
# Owner Oct 19 2026: makes our own sounds with Beat Machine. Add or change a recipe in sounds/recipes/*.json and push to
# main - this robot makes the WAVs in sounds/made/ (listen: sounds/lab.html - tabs Newest / Soundtracks / Sound effects / Engines). See tools/sound-robot.mjs.
on:
  push:
    branches: [main]
    paths: ['sounds/recipes/**', 'sounds/rejects/**', 'tools/sound-robot.mjs', 'tools/sound-themes.mjs', 'beatmachine.html']
  workflow_dispatch:
concurrency: { group: sound-robot, cancel-in-progress: false }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  make:
    if: github.repository == 'Attacked-Kraken/18-Games-Casino'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          which ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
      - name: Make the sounds
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          node tools/sound-themes.mjs   # turns 🗑 deletes (sounds/rejects) into totally different remakes
          node tools/sound-robot.mjs | tee sound-report.txt
          cat sound-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save them
        run: |
          git add -A sounds/made sounds/recipes sounds/rejects sounds/bumps.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git config user.name "sound robot"; git config user.email "actions@users.noreply.github.com"
          git commit -m "Sound robot: $(grep -E '^(MADE|FAILED)' sound-report.txt | cut -d' ' -f1-2 | paste -sd ' ' | cut -c1-180)"
          # owner Oct 21 2026: main is protected (PR + green check) - save on a branch, open a pull request, start the
          # game check on it; the merge robot merges it when green. No direct push to main.
          B="robot/sound-${{ github.run_number }}"
          git checkout -q -b "$B" && git push -q origin "$B"
          N=$(gh api repos/${{ github.repository }}/pulls -f head="$B" -f base=main -f title="Sound robot: run ${{ github.run_number }}" -f body="Made by the sound robot. Merged by the merge robot when the game check is green." --jq .number)
          gh workflow run game-check-pr.yml --ref "$B" || true
          echo "::notice title=Sound robot::opened pull request #$N"
