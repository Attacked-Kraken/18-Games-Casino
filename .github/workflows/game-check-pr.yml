name: Game check (PR)
# Owner Oct 21 2026 "split the good from repairs so it doesn't take 50 min - do both": the robot on a PULL REQUEST plays
# the games SIDE BY SIDE (one robot per game, up to 8 at once) and one small step ("check") gives the verdict - about
# 8-10 minutes instead of 50. A Claude change to the robot's own files plays ONE small reference game here (Paper Plane, owner Oct 23 2026); main's full
# check after the merge (game-check.yml, auto-undo) covers the rest. The 55-minute limit stays as the safety net.
# The verdict job is NAMED "check" so the owner's GitHub rule ("check" must pass) and the merge robot keep working.
on:
  pull_request:
  workflow_dispatch:        # robots start it on their own branch (robot/*) - a PR opened by a robot gets no PR event
concurrency:
  group: game-check-pr-${{ github.head_ref || github.ref_name }}   # one run per PR branch - a PR run and a robot retry/dispatch on the same branch share it (owner Oct 23 6:40 PM)
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.pick.outputs.games }}
      list: ${{ steps.pick.outputs.list }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check status - RUNNING (one readout the Muse reads)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/game-check/status-comment.sh "${{ github.event.pull_request.number }}" RUNNING
      - name: Pick what this pull request needs played
        id: pick
        run: |
          BASE=${{ github.base_ref || 'main' }}
          git fetch -q origin $BASE game-checks || true
          git show origin/game-checks:results.json > base-results.json 2>/dev/null || echo '{}' > base-results.json
          CH=$(git diff --name-only origin/$BASE...HEAD)
          echo "$CH" > changed.txt
          echo "$CH"
          G=""
          for f in $(echo "$CH" | grep -E '^apex[a-z0-9]*\.html$'); do G="$G$f,"; done
          for f in $(echo "$CH" | grep -E '^tools/game-check/fixes/apex[a-z0-9]*\.mjs$'); do G="$G$(basename $f .mjs).html,"; done
          MODE="touched"
          NOTES='\.md$|^(jobs|reviews|plans|looks|ideas|team|notes)/'
          if echo "$CH" | grep -qE '^(characters/|models/|vendor/|three\.module|look-presets\.js)'; then
            MODE="shared"
            # shared 3D people / gear / three.js changed -> every game that draws people (fair blame: hard breakage only)
            G="$G$(node -e "console.log(require('./tools/game-check/games.json').games.filter(g=>g.people).map(g=>g.file).join(','))"),"
          elif [ -z "$G" ] && [ -n "$CH" ] && echo "$CH" | grep -qvE "$NOTES"; then
            # no game / fixes / shared folder, but code did change (robots, workflows, hub, kit...): a Claude's robot-only
            # change -> 2 reference games here (people game + vehicle game); main's full run after the merge does the rest
            MODE="robot-only"; G="apexpaperplane.html,"   # owner Oct 23 5:24 PM: ONE small reference game - a robot-only PR can't be killed by Hockey
          fi
          if echo "$CH" | grep -qE '^(models/|MODELS\.md|characters/)'; then G="${G}models,"; fi
          LIST=$(echo "$G" | tr ',' '\n' | grep -v '^$' | sort -u | paste -sd ',')
          # owner Oct 23 2026 7:47 PM: Hockey (56 play tests) is split into 4 robots that each play a quarter of its tests (TEST_PART k/n)
          LIST=$(echo "$LIST" | sed 's/\bapexhockey\.html\b/apexhockey.html@1of4,apexhockey.html@2of4,apexhockey.html@3of4,apexhockey.html@4of4/')
          # owner Oct 24 2026 (item 6, per-step times: the 'Play <game>' step is 8-19 min, 55-75% of it is that game's play tests):
          # the long games are split like Hockey - part 1 plays everything else, the other parts only their share of the tests
          LIST=$(echo "$LIST" | sed 's/\bapexflight\.html\b/apexflight.html@1of3,apexflight.html@2of3,apexflight.html@3of3/; s/\bapexf1\.html\b/apexf1.html@1of3,apexf1.html@2of3,apexf1.html@3of3/; s/\bapextrackfield\.html\b/apextrackfield.html@1of3,apextrackfield.html@2of3,apextrackfield.html@3of3/; s/\bapexbaseball\.html\b/apexbaseball.html@1of2,apexbaseball.html@2of2/')
          JSON=$(echo "$LIST" | tr ',' '\n' | grep -v '^$' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.stringify(s.split('\n').filter(Boolean))))")
          echo "games=$JSON" >> $GITHUB_OUTPUT
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Mode: $MODE - playing: ${LIST:-nothing (notes only)}"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            base-results.json
            changed.txt
          if-no-files-found: ignore

  play:
    needs: plan
    if: needs.plan.outputs.games != '[]'
    runs-on: ubuntu-24.04
    # owner Oct 23 2026 6:19 PM: the browser install failed 4 tries even after the apt fix (#1369's own run) - play jobs run INSIDE
    # Microsoft's official Playwright image: Chromium + WebKit + their system libraries are already in it, nothing to download.
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
      options: --ipc=host
    timeout-minutes: 55      # owner Oct 21: the 55-minute limit stays as the safety net
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        game: ${{ fromJson(needs.plan.outputs.games) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test browser (already in the image)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          ls /ms-playwright
      - name: Play ${{ matrix.game }}
        run: |
          node tools/game-check/serve.mjs 8811 >/dev/null 2>&1 &
          sleep 2
          if [ "${{ matrix.game }}" = "models" ]; then
            ONLY=none node tools/game-check/check.mjs http://127.0.0.1:8811/ game-check-out
          else
            M="${{ matrix.game }}"; GAME="${M%@*}"; PART=""
            case "$M" in *@*of*) P="${M#*@}"; PART="${P%of*}/${P#*of}";; esac
            ONLY="$GAME" TEST_PART="$PART" SKIP_MODELS=1 node tools/game-check/check.mjs http://127.0.0.1:8811/ game-check-out
          fi
      - name: iPhone Safari pass
        if: always() && matrix.game != 'models' && !contains(matrix.game, '@2of') && !contains(matrix.game, '@3of') && !contains(matrix.game, '@4of')
        continue-on-error: true
        run: |
          [ -f game-check-out/results.json ] || exit 0
          node tools/game-check/serve.mjs 8812 >/dev/null 2>&1 &
          sleep 2
          M="${{ matrix.game }}"; ONLY="${M%@*}" timeout 600 node tools/game-check/safari.mjs http://127.0.0.1:8812/ game-check-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-${{ matrix.game }}
          path: game-check-out
          if-no-files-found: ignore

  check:
    name: check
    needs: [plan, play]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:                 # contents: write only so the evidence step can save error pictures on the pr-evidence branch
      contents: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: play-*
          path: parts
      - name: Put the results together and judge
        env:
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/game-check/merge-results.mjs parts game-check-out "${{ needs.plan.outputs.list }}"
          echo "Mode: ${{ needs.plan.outputs.mode }} (played side by side)"
          node tools/game-check/judge.mjs game-check-out/results.json base-results.json changed.txt game-check-out
      - name: Check status - PASSED / FAILED + reason (one readout the Muse reads)
        if: always()      # also on a robot re-run (workflow_dispatch): #1616's passed re-run left a stale ROBOT comment (Oct 24 9:00 PM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
          PLAY: ${{ needs.play.result }}
        run: |
          PRN="${{ github.event.pull_request.number }}"
          if [ -z "$PRN" ]; then PRN=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:${GITHUB_REF_NAME}" -q '.[0].number' 2>/dev/null || true); fi
          [ -n "$PRN" ] || exit 0          # a run on a branch with no open pull request has nothing to comment on
          if [ "$OUTCOME" = "success" ]; then bash tools/game-check/status-comment.sh "$PRN" PASSED; exit 0; fi
          R=game-check-out/blockers.txt
          if [ ! -s "$R" ]; then mkdir -p game-check-out; echo "The robot itself broke before it could judge (play step: $PLAY) - not your game." > $R; fi
          # Oct 23 2026 owner: "could not play it / played 0" is the robot's own trouble - never tell the Muse to push (that restarts everything)
          if [ "$PLAY" != "success" ] && grep -qiE "could not play it|played 0 game|robot itself broke" "$R" game-check-out/*.txt 2>/dev/null; then
            bash tools/game-check/status-comment.sh "$PRN" ROBOT "$R"; exit 0; fi
          # owner Oct 24 2026 9:12 PM: script-error evidence (stack, console, 3 pictures, code lines) goes in the same comment
          python3 tools/game-check/pr-evidence.py "$PRN" parts game-check-out || echo "::warning title=evidence::could not save the error evidence"
          bash tools/game-check/status-comment.sh "$PRN" FAILED "$R" game-check-out/evidence.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-check-out
          path: game-check-out
          if-no-files-found: ignore
