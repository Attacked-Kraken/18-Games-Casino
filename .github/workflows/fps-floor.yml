name: FPS floor

# JOB-05. A PR may not make a sports game more than 15% slower.
# It measures main and the PR on the SAME runner, back to back (main's numbers become fps-baseline.json for this run),
# so a slow GitHub machine can't fake a drop. On main it refreshes tools/fps-check/fps-baseline.json as an artifact.
on:
  pull_request:
    paths: ['apex*.html', 'characters/**', 'models/**', 'vendor/**', 'three.module*.js', 'venues/**', 'tools/fps-check/**']
  workflow_dispatch:

concurrency:
  group: fps-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Pick games
        id: pick
        run: |
          SIX="apexbaseball.html apexhockey.html apexflight.html apextrackfield.html apexf1.html apexracer.html"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CH=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            if echo "$CH" | grep -qE '^(characters/|models/|vendor/|venues/|three\.module|tools/fps-check/)'; then G="$SIX"
            else G=$(for g in $SIX; do echo "$CH" | grep -qx "$g" && echo -n "$g "; done); fi
          else G="$SIX"; fi
          echo "games=$G" >> $GITHUB_OUTPUT
      - name: Measure main (the baseline)
        if: steps.pick.outputs.games != '' && github.event_name == 'pull_request'
        run: |
          git worktree add -q ../base origin/${{ github.base_ref }}
          cp tools/fps-check/fps.mjs ../fps.mjs
          ln -s "$PWD/node_modules" ../node_modules
          node ../fps.mjs --root ../base --baseline fps-baseline.json --update ${{ steps.pick.outputs.games }}
      - name: Measure this PR and compare (fails if >15% slower)
        if: steps.pick.outputs.games != ''
        run: |
          B=fps-baseline.json; [ -f $B ] || B=tools/fps-check/fps-baseline.json
          node tools/fps-check/fps.mjs --baseline $B --out fps-result.json ${{ steps.pick.outputs.games }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.games != ''
        with: { name: fps, path: 'fps-*.json' }
