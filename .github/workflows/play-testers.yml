name: Play testers

# 4 robot testers really PLAY every game (owner Oct 20: "we need like 4 game testers", "games that improve overnight").
# Overnight: 10 PM, 1 AM, 4 AM Central, plus by hand. Report: the "playtests" branch (README.md + results.json).
on:
  schedule:
    - cron: '13 3,6,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: play-testers
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - tester: A
            games: apexhockey.html,apexf1.html,apexsoccer.html
          - tester: B
            games: apexbaseball.html,apexflight.html
          - tester: C
            games: apextrackfield.html,apexracer.html
          - tester: D
            games: apexmonstertruck.html,apexpaperplane.html,apexreefdash.html,apexmoto.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Play
        env:
          GAMES: ${{ matrix.games }}
          TESTER: ${{ matrix.tester }}
        run: |
          python3 -m http.server 8811 >/dev/null 2>&1 &
          sleep 2
          node tools/playtest/play.mjs http://127.0.0.1:8811/ playtest-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tester-${{ matrix.tester }}
          path: playtest-out
          retention-days: 3

  report:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Join the 4 reports
        run: |
          mkdir -p playtest-out/img
          for d in parts/*/; do cp -r "$d"img/. playtest-out/img/ 2>/dev/null || true; cp "$d"results-*.json playtest-out/ 2>/dev/null || true; done
          node tools/playtest/report.mjs playtest-out
      - name: Post to the playtests branch
        run: |
          cd playtest-out
          git init -q
          git checkout -q -b playtests
          git config user.name "play tester bot"
          git config user.email "play-tester-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Play testers for main @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" playtests
