name: Sketchfab fetch
# Owner Oct 19 2026: downloads the Sketchfab models asked for in MODEL-REQUESTS.md (exact model link, OPEN line) with the
# owner's own Sketchfab API token, so no Muse ever has to sign in. CC Attribution / CC0 only. See tools/sketchfab-fetch.mjs.
# Needs the repo secret SKETCHFAB_TOKEN (Sketchfab > Settings > Password & API > API token). Never put the token anywhere else.
on:
  push:
    branches: [main]
    paths: ['MODEL-REQUESTS.md', 'MODEL-SEARCH.md', 'models/picks/**']
  workflow_dispatch:
    inputs:
      dry:
        description: 'Only check, download nothing (1 = yes)'
        default: ''
      test:
        description: 'Token test: a Sketchfab model link or id (checks the download works, saves nothing)'
        default: ''
      search:
        description: 'Search Sketchfab (free CC-BY / CC0 only), e.g. hockey arena; race car (results: tools/model-search.html)'
        default: ''
      slim:
        description: 'Slim every model in the repo over 6 MB or 100,000 triangles for phones (1 = yes)'
        default: ''
      clean:
        description: 'Cleaner test: a model path (shows what would be removed, saves nothing)'
        default: ''
concurrency: { group: sketchfab-fetch, cancel-in-progress: false }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  fetch:
    if: github.repository == 'Attacked-Kraken/18-Games-Casino'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @gltf-transform/cli@4 >/dev/null && npm i --prefix /tmp/gt @gltf-transform/core@4 @gltf-transform/functions@4 @gltf-transform/extensions@4 >/dev/null && cp tools/glb-clean.mjs /tmp/gt/
      - name: Cleaner test
        if: github.event.inputs.clean != ''
        run: node /tmp/gt/glb-clean.mjs "$GITHUB_WORKSPACE/${{ github.event.inputs.clean }}" /tmp/clean-test.glb
      - name: Search
        if: github.event.inputs.clean == ''
        env:
          SEARCH: ${{ github.event.inputs.search }}
        run: node tools/sketchfab-search.mjs
      - name: Fetch
        if: github.event.inputs.clean == ''
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          DRY: ${{ github.event.inputs.dry }}
          TEST_UID: ${{ github.event.inputs.test }}
        run: node tools/sketchfab-fetch.mjs
      - name: Shrink + save
        if: github.event.inputs.clean == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat fetch-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          # owner Oct 19 "remove heaviness, make it usable for phones": every model ends up under ~6 MB -
          # fewer triangles (simplify keeps the shape), smaller WebP textures, quantized - no special loader needed
          slim() { f="$1"; out="$2"; t=/tmp/slim-$$.glb
            SIZE="$(cat "${out%.glb}.size" 2>/dev/null || true)" node /tmp/gt/glb-clean.mjs "$PWD/$f" "$PWD/$f" || echo "::warning title=Model cleaner::could not clean $f"   # shadow/ground sheets out + real size
            rm -f "${out%.glb}.size"
            gltf-transform optimize "$f" "$out" --compress quantize --texture-compress webp --texture-size 1024 --simplify false
            for step in "0.5 1024" "0.25 1024" "0.12 512" "0.06 512"; do
              set -- $step; [ $(stat -c %s "$out") -le 6000000 ] && break
              gltf-transform simplify "$f" "$t" --ratio $1 --error 0.01
              gltf-transform optimize "$t" "$out" --compress quantize --texture-compress webp --texture-size $2 --simplify false
            done
            # owner Oct 19 (Gemini idea #2): also cap the DETAIL - a small file can still have so many triangles that a
            # phone stutters. Over 100,000 triangles -> simplify (keeps the shape) until it fits.
            for k in 1 2 3; do
              tris=$(node tools/glb-tris.mjs "$out"); [ "$tris" -le 100000 ] && break
              ratio=$(node -e "console.log(Math.max(0.05, 100000 / $tris * 0.9).toFixed(3))")
              gltf-transform simplify "$out" "$t" --ratio $ratio --error 0.02
              gltf-transform optimize "$t" "$out" --compress quantize --texture-compress webp --texture-size 1024 --simplify false
            done; rm -f "$t"
            echo "::notice title=Sketchfab robot::$out: $(node tools/glb-tris.mjs "$out") triangles"
            echo "::notice title=Sketchfab robot::slim $out: $(( $(stat -c %s "$out") / 1024 )) KB"
            echo "shrunk $out: $(( $(stat -c %s "$out") / 1024 )) KB" | tee -a fetch-report.txt; }
          for f in $(ls models/fetched/*-raw.glb 2>/dev/null); do slim "$f" "${f%-raw.glb}.glb"; rm -f "$f"; done
          if [ -n "${{ github.event.inputs.slim }}" ]; then
            for f in $(git ls-files '*.glb' | grep -v '^characters/'); do   # every big model in the repo (rigged people stay as they are)
              [ $(stat -c %s "$f") -le 6000000 ] && [ $(node tools/glb-tris.mjs "$f") -le 100000 ] && continue
              cp "$f" /tmp/orig.glb; slim /tmp/orig.glb "$f"
            done
            echo "SLIMMED old models" >> fetch-report.txt
          fi
          # owner Oct 21 2026 (upgrade b): front, side, back and top pictures of every new model, next to it
          # (models/fetched/<name>-front.jpg ...) - the job card shows them for the owner's approval before any game uses it
          NEW=$(git ls-files --others --exclude-standard models/fetched | grep '\.glb$' || true)
          if [ -n "$NEW" ]; then
            npm install --no-save --no-package-lock playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 || true
            python3 -m http.server 8814 >/dev/null 2>&1 &
            sleep 2
            for f in $NEW; do node tools/model-shots.mjs http://127.0.0.1:8814/ "$f" || echo "::warning title=Sketchfab robot::no pictures for $f"; done
          fi
          git diff --quiet && [ -z "$(git ls-files --others --exclude-standard models MODEL-SEARCH.md)" ] && { echo "nothing to save"; exit 0; }
          node tools/asset-check.mjs
          git config user.name "sketchfab fetch robot"; git config user.email "actions@users.noreply.github.com"
          git add -A MODEL-REQUESTS.md MODEL-SEARCH.md ASSETS.md models
          git commit -m "Sketchfab fetch robot: $(grep -E '^(FETCHING|SKIPPED|FAILED|SLIMMED|shrunk)' fetch-report.txt | paste -sd ' ' | cut -c1-180)"
          # owner Oct 21 2026: main is protected (PR + green check) - the robot saves on its own branch, opens a pull
          # request and starts the game check on it; the merge robot merges it when green. No direct push to main.
          B="robot/sketchfab-${{ github.run_number }}"
          git checkout -q -b "$B" && git push -q origin "$B"
          N=$(gh api repos/${{ github.repository }}/pulls -f head="$B" -f base=main -f title="Sketchfab fetch robot: new models (run ${{ github.run_number }})" -f body="$(cat fetch-report.txt | head -40)" --jq .number)
          gh workflow run game-check-pr.yml --ref "$B" || true
          echo "::notice title=Sketchfab robot::opened pull request #$N - the merge robot merges it when the game check is green"
